<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة الأستاذ</title>
<meta name="theme-color" content="#8a1d5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css">
<style>
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.adm-head h1{font-size:24px;margin:0}
.field{display:block;margin:12px 0}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field small{color:var(--muted);font-weight:400}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{min-height:96px;resize:vertical;line-height:1.7}
.pad{padding:16px}
.row-list{display:grid;gap:10px}
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface)}
.erow.off{opacity:.55}
.erow .num{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.erow .body{flex:1;min-width:0}
.erow .body b{display:block;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.erow .body small{color:var(--muted);font-size:12.5px}
.icons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.erow .icons{width:100%;justify-content:flex-start;padding-top:8px;border-top:1px solid var(--line)}
@media (min-width:640px){.erow{flex-wrap:nowrap}.erow .icons{width:auto;border-top:0;padding-top:0}}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:16px}
.ib:disabled{opacity:.3}
.ib.danger{color:var(--bad)}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.qrow .num{flex:none;font-weight:700;color:var(--brand);min-width:28px}
.qrow .body{flex:1;min-width:0;font-size:14.5px;line-height:1.6}
.qrow .ans{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:99px}
.savebar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;font-size:13.5px;color:var(--muted)}
.savebar .msg b{color:var(--warn)}
.note{padding:14px 16px;border-radius:14px;background:var(--brand-soft);font-size:14px;line-height:1.7;margin-top:14px}
.opt-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-edit .L{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.opt-edit input[type=text]{flex:1}
.opt-edit label{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);flex:none;cursor:pointer;padding:6px}
.opt-edit input[type=radio]{width:20px;height:20px;accent-color:var(--ok)}
.opt-edit.correct input[type=text]{border-color:var(--ok);background:var(--ok-soft)}
.sheet .modal-actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-20px;background:var(--surface);padding:10px 0}
.sheet .modal-actions .btn{flex:1}
.err-box{color:var(--bad);font-weight:600;font-size:14px;margin-top:8px;min-height:1px}
.parse-ok{color:var(--ok);font-weight:700}
.parse-bad{color:var(--bad);font-weight:700}
pre.fmt{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:13.5px;white-space:pre-wrap;margin:8px 0;line-height:1.8}
.sec-row{display:flex;gap:8px;margin-bottom:8px}
.sec-row input{flex:1}
.progress-log{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.9}
.tbtn{font-size:13px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;background:var(--surface);min-height:40px}
.switch.sm{width:42px;height:26px}.switch.sm::after{width:20px;height:20px}.switch.sm[aria-checked="true"]::after{right:19px}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="loading"><div class="spinner"></div>جاري التحميل…</div></main>
<div id="layer"></div>

<script>
/* ======================== config ======================== */
const GH = (()=>{
  const fallback = {owner:"imissherhz-source", repo:"unit3-exam", branch:"main"};
  const h = location.hostname;
  if(h.endsWith(".github.io")){
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return {owner:h.split(".")[0], repo: seg && !seg.endsWith(".html") ? seg : h, branch:"main"};
  }
  return fallback;
})();
const API = "https://api.github.com";
const TOKEN_KEY = "admin-gh-token";

/* ======================== helpers ======================== */
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const LET = ["أ","ب","ج","د","هـ","و"];
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64enc = s => { const b = new TextEncoder().encode(s); let bin=""; for(let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")), c=>c.charCodeAt(0)));
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
const closeLayer = () => $("#layer").innerHTML = "";
function confirmBox(title, text, okLabel, danger){
  return new Promise(res=>{
    $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="modal"><h3>${title}</h3><p>${text}</p>
      <div class="row"><button class="btn ghost" id="cNo">إلغاء</button><button class="btn primary" id="cYes" ${danger?'style="background:var(--bad)"':""}>${okLabel}</button></div></div></div>`;
    $("#cNo").onclick=()=>{closeLayer();res(false)}; $("#cYes").onclick=()=>{closeLayer();res(true)};
  });
}

/* ======================== GitHub API ======================== */
let TOKEN = store.get(TOKEN_KEY) || (()=>{try{return sessionStorage.getItem(TOKEN_KEY)}catch(e){return null}})() || "";
async function gh(path, opts={}){
  const r = await fetch(API+path, {...opts, headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+TOKEN,"X-GitHub-Api-Version":"2022-11-28",...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){ const e = new Error("GitHub "+r.status); e.status=r.status; try{e.body=await r.json()}catch(_){} throw e; }
  return r.status===204 ? null : r.json();
}
const contentsPath = p => `/repos/${GH.owner}/${GH.repo}/contents/${p}`;
async function readFile(p){
  const d = await gh(contentsPath(p)+"?ref="+GH.branch+"&t="+Date.now());
  return {sha:d.sha, text:b64dec(d.content)};
}
async function writeFile(p, text, sha, msg){
  const body = {message:msg, content:b64enc(text), branch:GH.branch}; if(sha) body.sha=sha;
  try{ return await gh(contentsPath(p), {method:"PUT", body:JSON.stringify(body)}); }
  catch(e){
    if(e.status===409 || e.status===422){ // stale sha: refetch and retry once
      try{ const cur = await gh(contentsPath(p)+"?ref="+GH.branch+"&t="+Date.now()); body.sha=cur.sha; }catch(_){ delete body.sha; }
      return await gh(contentsPath(p), {method:"PUT", body:JSON.stringify(body)});
    }
    throw e;
  }
}
async function deleteFile(p, sha, msg){
  if(!sha){ try{ sha = (await gh(contentsPath(p)+"?ref="+GH.branch)).sha; }catch(e){ if(e.status===404) return; throw e; } }
  return gh(contentsPath(p), {method:"DELETE", body:JSON.stringify({message:msg, sha, branch:GH.branch})});
}

/* ======================== state ======================== */
let IDX = null, IDX_SHA = null;      // exams.json
const EXAMS = {};                     // id -> {data, sha, dirty}
let deleted = [];                     // exam ids removed (files to delete)
let dirtyIndex = false;
let view = {name:"dash"};
const dirtyCount = () => (dirtyIndex?1:0) + Object.values(EXAMS).filter(e=>e.dirty).length + deleted.length;
function markIndex(){ dirtyIndex = true; updateSaveBar(); }
function markExam(id){ EXAMS[id].dirty = true; const m = IDX.exams.find(e=>e.id===id); if(m){ m.count = EXAMS[id].data.questions.length; m.title = EXAMS[id].data.title; m.desc = EXAMS[id].data.desc||""; } markIndex(); }
window.addEventListener("beforeunload", e=>{ if(dirtyCount()){ e.preventDefault(); e.returnValue=""; } });

async function loadExam(id){
  if(EXAMS[id]) return EXAMS[id];
  const f = await readFile("exams/"+id+".json");
  EXAMS[id] = {data:JSON.parse(f.text), sha:f.sha, dirty:false};
  return EXAMS[id];
}

/* ======================== LOGIN ======================== */
function renderLogin(err){
  $("#app").innerHTML = `
  <div class="card hero"><span class="eyebrow">🔒 دخول الأستاذ</span><h1>لوحة التحكم</h1>
    <p class="sub">رتّب الامتحانات، غيّر أسماءها، أخفِها أو أظهرها، وأضف أسئلة جديدة.</p></div>
  <div class="card pad" style="margin-top:14px">
    <label class="field"><span>رمز الدخول <small>(يعطيك إياه مسؤول الموقع)</small></span>
      <input type="password" id="tok" autocomplete="current-password" placeholder="github_pat_…" dir="ltr"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 4px"><input type="checkbox" id="remember" checked style="width:20px;height:20px;accent-color:var(--brand)"> تذكّرني على هذا الجهاز</label>
    <div class="err-box" id="lerr">${err?esc(err):""}</div>
    <button class="btn primary block" id="loginBtn" style="margin-top:12px">دخول</button>
  </div>
  <a class="teacher-link" href="./">← العودة للموقع</a>`;
  $("#loginBtn").onclick = async ()=>{
    const t = $("#tok").value.trim(); if(!t){ $("#lerr").textContent="اكتب رمز الدخول"; return; }
    $("#loginBtn").disabled=true; $("#loginBtn").textContent="جاري التحقق…";
    TOKEN = t;
    const ok = await verify();
    if(ok===true){ if($("#remember").checked) store.set(TOKEN_KEY,t); else { try{sessionStorage.setItem(TOKEN_KEY,t)}catch(e){} } boot(); }
    else { TOKEN=""; renderLogin(ok); }
  };
  $("#tok").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#loginBtn").click(); });
}
async function verify(){
  try{
    const r = await gh(`/repos/${GH.owner}/${GH.repo}`);
    if(r.permissions && r.permissions.push===false) return "هذا الرمز للقراءة فقط، يحتاج صلاحية تعديل";
    return true;
  }catch(e){
    if(e.status===401) return "الرمز غير صحيح أو منتهي الصلاحية";
    if(e.status===403||e.status===404) return "الرمز لا يملك صلاحية على هذا الموقع";
    return "تعذّر الاتصال، تأكد من الإنترنت";
  }
}

/* ======================== DASHBOARD ======================== */
function renderDash(){
  view = {name:"dash"};
  const ex = IDX.exams;
  $("#app").innerHTML = `
  <div class="adm-head"><h1>لوحة الأستاذ</h1>
    <span style="display:flex;gap:6px"><a class="tbtn" href="./" target="_blank" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center">👁 الموقع</a><button class="tbtn" id="logout">خروج</button></span></div>
  <p class="sub" style="margin-bottom:14px">الترتيب هنا هو نفس ترتيب الامتحانات عند الطلاب.</p>

  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>الامتحانات (${AR(ex.length)})</span><button class="tbtn" id="newExam" style="color:var(--brand);border-color:var(--brand)">＋ امتحان جديد</button></div>
  <div class="row-list" id="elist">${ex.length? ex.map((e,i)=>`
    <div class="erow ${e.visible===false?"off":""}">
      <span class="num">${AR(i+1)}</span>
      <span class="body"><b>${esc(e.title)}</b><small>${AR(e.count||0)} سؤال · ${e.visible===false?"مخفي عن الطلاب":"ظاهر للطلاب"}</small></span>
      <span class="icons">
        <button class="ib" data-act="up" data-i="${i}" ${i===0?"disabled":""} aria-label="لأعلى">↑</button>
        <button class="ib" data-act="down" data-i="${i}" ${i===ex.length-1?"disabled":""} aria-label="لأسفل">↓</button>
        <button class="ib" data-act="vis" data-i="${i}" aria-label="إظهار/إخفاء">${e.visible===false?"🙈":"👁"}</button>
        <button class="ib" data-act="edit" data-i="${i}" aria-label="تعديل">✎</button>
        <button class="ib danger" data-act="del" data-i="${i}" aria-label="حذف">🗑</button>
      </span></div>`).join("") : `<div class="card pad empty">لا توجد امتحانات بعد</div>`}</div>

  <div class="section-title">إعدادات الصفحة الرئيسية</div>
  <div class="card pad">
    <label class="field"><span>عنوان الموقع</span><input type="text" id="sTitle" value="${esc(IDX.site.title||"")}"></label>
    <label class="field"><span>الوصف</span><input type="text" id="sSub" value="${esc(IDX.site.subtitle||"")}"></label>
    <label class="field"><span>اسم الأستاذ / المعدّ</span><input type="text" id="sTeacher" value="${esc(IDX.site.teacher||"")}"></label>
  </div>

  <div class="note">📄 <b>عندك نموذج امتحان PDF؟</b> أرسله لمسؤول الموقع مع الإجابات المعتمدة إن وُجدت، ويُضاف هنا جاهزًا. وإذا ما فيه إجابات معتمدة، يُحلّ وتُضاف الإجابات له.</div>
  <div style="height:90px"></div>`;
  $("#logout").onclick = async ()=>{ if(dirtyCount() && !(await confirmBox("تغييرات غير محفوظة","عندك تغييرات لم تُنشر بعد. تخرج بدون حفظ؟","خروج",true))) return; store.del(TOKEN_KEY); try{sessionStorage.removeItem(TOKEN_KEY)}catch(e){} location.reload(); };
  $("#newExam").onclick = newExamDialog;
  ["sTitle","sSub","sTeacher"].forEach((id,k)=>$("#"+id).oninput=e=>{ IDX.site[["title","subtitle","teacher"][k]] = e.target.value; markIndex(); });
  document.querySelectorAll("#elist [data-act]").forEach(b=>b.onclick=()=>examAction(b.dataset.act, +b.dataset.i));
  updateSaveBar();
}
async function examAction(act, i){
  const ex = IDX.exams, e = ex[i];
  if(act==="up"){ [ex[i-1],ex[i]]=[ex[i],ex[i-1]]; markIndex(); renderDash(); }
  else if(act==="down"){ [ex[i+1],ex[i]]=[ex[i],ex[i+1]]; markIndex(); renderDash(); }
  else if(act==="vis"){ e.visible = e.visible===false; markIndex(); renderDash(); }
  else if(act==="del"){
    if(!(await confirmBox("حذف الامتحان؟", `سيُحذف «${esc(e.title)}» وكل أسئلته (${AR(e.count||0)}) من الموقع بعد الحفظ. لا يمكن التراجع بعد النشر.`, "حذف", true))) return;
    ex.splice(i,1); if(EXAMS[e.id]?.isNew) delete EXAMS[e.id]; else { deleted.push(e.id); delete EXAMS[e.id]; }
    markIndex(); renderDash();
  }
  else if(act==="edit"){ openEditor(e.id); }
}
function newExamDialog(){
  $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="sheet"><h3>امتحان جديد</h3>
    <label class="field"><span>اسم الامتحان</span><input type="text" id="nTitle" placeholder="مثال: شامل الوحدة الرابعة"></label>
    <label class="field"><span>وصف قصير <small>(اختياري)</small></span><input type="text" id="nDesc" placeholder="مثال: نص … · الحال"></label>
    <label class="field"><span>الأقسام <small>(اختياري — افصل بينها بفاصلة، مثل: النصوص، القواعد)</small></span><input type="text" id="nSecs" placeholder="اتركه فارغًا لقسم واحد"></label>
    <div class="err-box" id="nErr"></div>
    <div class="modal-actions"><button class="btn ghost" id="nCancel">إلغاء</button><button class="btn primary" id="nOk">إنشاء</button></div></div></div>`;
  $("#nCancel").onclick=closeLayer; setTimeout(()=>$("#nTitle").focus(),50);
  $("#nOk").onclick=()=>{
    const title=$("#nTitle").value.trim(); if(!title){ $("#nErr").textContent="اكتب اسم الامتحان"; return; }
    const names=$("#nSecs").value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
    const sections = (names.length?names:["الأسئلة"]).map((n,i)=>({id:"s"+(i+1), name:n}));
    const id = "e"+Date.now().toString(36);
    EXAMS[id] = {data:{id,title,desc:$("#nDesc").value.trim(),sections,questions:[]}, sha:null, dirty:true, isNew:true};
    IDX.exams.push({id,title,desc:EXAMS[id].data.desc,count:0,visible:false,v:1});
    markIndex(); closeLayer(); openEditor(id);
    toast("الامتحان الجديد مخفي حتى تضيف أسئلته وتظهره");
  };
}

/* ======================== EXAM EDITOR ======================== */
async function openEditor(id){
  $("#app").innerHTML = `<div class="loading"><div class="spinner"></div>جاري تحميل الأسئلة…</div>`;
  try{ await loadExam(id); }catch(e){ toast("تعذّر تحميل الامتحان"); renderDash(); return; }
  view = {name:"edit", id}; renderEditor();
}
function renderEditor(){
  const E = EXAMS[view.id].data, secs = E.sections;
  const counts = {}; const numOf = {};
  E.questions.forEach(q=>{ counts[q.s]=(counts[q.s]||0)+1; numOf[q.id]=counts[q.s]; });
  let qhtml = "";
  secs.forEach(s=>{
    const qs = E.questions.map((q,i)=>[q,i]).filter(([q])=>q.s===s.id);
    if(secs.length>1) qhtml += `<div class="grid-head" style="margin-top:18px">${esc(s.name)} (${AR(qs.length)})</div>`;
    qhtml += `<div class="row-list">` + (qs.length ? qs.map(([q,i])=>`
      <div class="qrow"><span class="num">${AR(numOf[q.id])}</span>
        <span class="body">${esc(q.q.length>140?q.q.slice(0,140)+"…":q.q).replace(/\n/g,"<br>")}<br><span class="ans">✓ ${LET[q.a]}) ${esc(q.o[q.a]).slice(0,60)}</span></span>
        <span class="icons" style="flex-direction:column">
          <button class="ib" data-q="edit" data-i="${i}" aria-label="تعديل">✎</button>
          <button class="ib danger" data-q="del" data-i="${i}" aria-label="حذف">🗑</button></span></div>`).join("")
      : `<div class="empty" style="padding:14px">لا توجد أسئلة في هذا القسم</div>`) + `</div>`;
  });
  $("#app").innerHTML = `
  <button class="back" id="toDash">→ كل الامتحانات</button>
  <div class="card pad">
    <label class="field"><span>اسم الامتحان</span><input type="text" id="eTitle" value="${esc(E.title)}"></label>
    <label class="field"><span>وصف قصير</span><input type="text" id="eDesc" value="${esc(E.desc||"")}"></label>
    <div class="field"><span>الأقسام</span><div id="secEd">${secs.map((s,i)=>`<div class="sec-row"><input type="text" data-sec="${i}" value="${esc(s.name)}"><button class="ib danger" data-secdel="${i}" ${secs.length<2?"disabled":""} aria-label="حذف القسم">🗑</button></div>`).join("")}</div>
      <button class="tbtn" id="addSec">＋ قسم</button></div>
  </div>
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span>الأسئلة (${AR(E.questions.length)})</span>
    <span style="display:flex;gap:6px"><button class="tbtn" id="bulk">📋 لصق مجموعة أسئلة</button><button class="tbtn" id="addQ" style="color:var(--brand);border-color:var(--brand)">＋ سؤال</button></span></div>
  ${qhtml}
  <div style="height:100px"></div>`;
  $("#toDash").onclick = renderDash;
  $("#eTitle").oninput = e=>{ E.title=e.target.value; markExam(view.id); };
  $("#eDesc").oninput = e=>{ E.desc=e.target.value; markExam(view.id); };
  document.querySelectorAll("[data-sec]").forEach(inp=>inp.oninput=e=>{ secs[+inp.dataset.sec].name=e.target.value; markExam(view.id); });
  document.querySelectorAll("[data-secdel]").forEach(b=>b.onclick=async()=>{
    const s = secs[+b.dataset.secdel], n = E.questions.filter(q=>q.s===s.id).length;
    if(!(await confirmBox("حذف القسم؟", n?`سيُحذف القسم «${esc(s.name)}» مع ${AR(n)} سؤال.`:`سيُحذف القسم «${esc(s.name)}».`, "حذف", true))) return;
    E.questions = E.questions.filter(q=>q.s!==s.id); secs.splice(+b.dataset.secdel,1); markExam(view.id); renderEditor();
  });
  $("#addSec").onclick=()=>{ let k=1; while(secs.some(s=>s.id==="s"+k)) k++; secs.push({id:"s"+k,name:"قسم جديد"}); markExam(view.id); renderEditor(); };
  $("#addQ").onclick=()=>questionDialog(null);
  $("#bulk").onclick=bulkDialog;
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.i;
    if(b.dataset.q==="edit") questionDialog(i);
    else if(await confirmBox("حذف السؤال؟", esc(E.questions[i].q.slice(0,90)), "حذف", true)){ E.questions.splice(i,1); markExam(view.id); renderEditor(); }
  });
  updateSaveBar();
}
function newQid(E){ let k=E.questions.length+1; const ids=new Set(E.questions.map(q=>q.id)); while(ids.has("q"+k)) k++; return "q"+k; }
function questionDialog(idx){
  const E = EXAMS[view.id].data, secs=E.sections;
  const q = idx===null ? {s:secs[secs.length-1].id, q:"", o:["","","",""], a:-1} : JSON.parse(JSON.stringify(E.questions[idx]));
  const draw = ()=>{
    $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="sheet"><h3>${idx===null?"سؤال جديد":"تعديل السؤال"}</h3>
      ${secs.length>1?`<label class="field"><span>القسم</span><select id="qSec">${secs.map(s=>`<option value="${esc(s.id)}" ${s.id===q.s?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>`:""}
      <label class="field"><span>نص السؤال <small>(لعرض اقتباس فوق السؤال: اكتبه في سطر أول ثم السؤال في سطر جديد)</small></span><textarea id="qText">${esc(q.q)}</textarea></label>
      <div class="field"><span>الخيارات <small>(اضغط «صحيحة» بجانب الإجابة المعتمدة)</small></span>
        <div id="opts">${q.o.map((o,k)=>`<div class="opt-edit ${q.a===k?"correct":""}"><span class="L">${LET[k]}</span><input type="text" data-o="${k}" value="${esc(o)}"><label><input type="radio" name="corr" value="${k}" ${q.a===k?"checked":""}>صحيحة</label>${q.o.length>2?`<button class="ib danger" data-orm="${k}" aria-label="حذف الخيار">✕</button>`:""}</div>`).join("")}</div>
        ${q.o.length<6?`<button class="tbtn" id="addOpt">＋ خيار</button>`:""}</div>
      <label class="field"><span>شرح الإجابة <small>(اختياري — يظهر للطالب بعد الحل)</small></span><textarea id="qExp" style="min-height:70px">${esc(q.e||"")}</textarea></label>
      <div class="err-box" id="qErr"></div>
      <div class="modal-actions"><button class="btn ghost" id="qCancel">إلغاء</button><button class="btn primary" id="qOk">${idx===null?"إضافة":"حفظ"}</button></div></div></div>`;
    const sync=()=>{ q.q=$("#qText").value; q.e=$("#qExp").value.trim(); if(!q.e) delete q.e; document.querySelectorAll("[data-o]").forEach(i=>q.o[+i.dataset.o]=i.value); if($("#qSec")) q.s=$("#qSec").value; };
    document.querySelectorAll("input[name=corr]").forEach(r=>r.onchange=()=>{ sync(); q.a=+r.value; draw(); });
    document.querySelectorAll("[data-orm]").forEach(b=>b.onclick=()=>{ sync(); const k=+b.dataset.orm; q.o.splice(k,1); if(q.a===k) q.a=-1; else if(q.a>k) q.a--; draw(); });
    $("#addOpt") && ($("#addOpt").onclick=()=>{ sync(); q.o.push(""); draw(); });
    $("#qCancel").onclick=closeLayer;
    $("#qOk").onclick=()=>{
      sync(); q.q=q.q.trim(); q.o=q.o.map(o=>o.trim());
      if(!q.q) return $("#qErr").textContent="اكتب نص السؤال";
      if(q.o.some(o=>!o)) return $("#qErr").textContent="عبّئ كل الخيارات أو احذف الفارغ منها";
      if(q.a<0||q.a>=q.o.length) return $("#qErr").textContent="حدّد الإجابة الصحيحة";
      if(idx===null){ q.id=newQid(E); insertInSection(E,q); } else E.questions[idx]=q;
      markExam(view.id); closeLayer(); renderEditor(); toast(idx===null?"أُضيف السؤال ✓":"حُفظ التعديل ✓");
    };
  };
  draw();
}
function insertInSection(E,q){ // keep questions grouped by section order
  let last=-1; E.questions.forEach((x,i)=>{ if(x.s===q.s) last=i; });
  if(last<0){ const order=E.sections.map(s=>s.id), si=order.indexOf(q.s); let pos=E.questions.length;
    for(let i=0;i<E.questions.length;i++){ if(order.indexOf(E.questions[i].s)>si){pos=i;break} } E.questions.splice(pos,0,q); }
  else E.questions.splice(last+1,0,q);
}

/* ---------- bulk paste parser ---------- */
const AR_DIG = s => s.replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const LETTER_IDX = l => ({"أ":0,"ا":0,"إ":0,"ب":1,"ج":2,"د":3,"ه":4,"هـ":4,"و":5,"a":0,"b":1,"c":2,"d":3,"A":0,"B":1,"C":2,"D":3})[l];
function parseBulk(text){
  const lines = AR_DIG(text).replace(/\r/g,"").split("\n");
  const qs=[]; let cur=null; let globalKey={};
  const qRe=/^\s*(?:س\s*)?(\d{1,3})\s*[-–).:\/]\s*(.*)$/;
  const oRe=/^\s*(هـ|[أاإبجدهوabcdABCD])\s*[-–).:]\s*(.+)$/;
  const aRe=/^\s*(?:الإجابة|الاجابة|الجواب|الإجابة الصحيحة|الاجابة الصحيحة)\s*[:：\-]?\s*\(?\s*(هـ|[أاإبجدهوabcdABCD])\s*\)?/;
  const kRe=/^\s*(?:الإجابات|الاجابات|مفتاح الإجابة|مفتاح الاجابة|الإجابات النموذجية)\s*[:：]?\s*(.*)$/;
  let inKey=false;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    let m;
    if((m=line.match(kRe))){ inKey=true; parseKey(m[1],globalKey); continue; }
    if(inKey && /^[\s\d\-–.):أابجدهـ،,]+$/.test(line)){ parseKey(line,globalKey); continue; }
    inKey=false;
    if((m=line.match(aRe))){ if(cur) cur.a=LETTER_IDX(m[1]); continue; }
    if(cur && cur.o.length<6 && (m=line.match(oRe)) && LETTER_IDX(m[1])===cur.o.length){ cur.o.push(m[2].trim()); continue; }
    if((m=line.match(qRe)) && (!cur || cur.o.length>=2)){ cur={n:+m[1], q:m[2].trim(), o:[], a:-1}; qs.push(cur); continue; }
    if(cur && cur.o.length===0){ cur.q += (cur.q?"\n":"")+line; continue; }
    if(cur && cur.o.length) { cur.o[cur.o.length-1]+=" "+line; continue; }
  }
  qs.forEach(q=>{ if(q.a<0 && globalKey[q.n]!==undefined) q.a=globalKey[q.n]; });
  return qs;
}
function parseKey(s,key){ const re=/(\d{1,3})\s*[-–.):]?\s*(هـ|[أاإبجدهو])/g; let m; while((m=re.exec(s))) key[+m[1]]=LETTER_IDX(m[2]); }
function bulkDialog(){
  const E = EXAMS[view.id].data, secs=E.sections;
  $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="sheet"><h3>لصق مجموعة أسئلة</h3>
    <p class="sub" style="font-size:14px">انسخ الأسئلة من أي ملف والصقها هنا بهذا الشكل:</p>
    <pre class="fmt">١) نص السؤال الأول
أ) الخيار الأول
ب) الخيار الثاني
ج) الخيار الثالث
د) الخيار الرابع
الإجابة: ب</pre>
    <p class="sub" style="font-size:13px">أو ضع الإجابات في آخر النص: <b>الإجابات: ١-ب ٢-ج ٣-أ …</b></p>
    ${secs.length>1?`<label class="field"><span>أضفها إلى قسم</span><select id="bSec">${secs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></label>`:""}
    <label class="field"><textarea id="bText" style="min-height:200px" placeholder="الصق الأسئلة هنا…"></textarea></label>
    <div id="bPrev" class="sub" style="font-size:14px"></div>
    <div class="modal-actions"><button class="btn ghost" id="bCancel">إلغاء</button><button class="btn primary" id="bOk" disabled>إضافة</button></div></div></div>`;
  let parsed=[];
  const upd=()=>{
    parsed=parseBulk($("#bText").value);
    const ok=parsed.filter(q=>q.o.length>=2&&q.a>=0&&q.a<q.o.length), noAns=parsed.filter(q=>q.o.length>=2&&(q.a<0||q.a>=q.o.length)), bad=parsed.filter(q=>q.o.length<2);
    $("#bPrev").innerHTML = parsed.length ? `<span class="parse-ok">✓ ${AR(ok.length)} سؤال جاهز</span>`
      + (noAns.length?`<br><span class="parse-bad">⚠ ${AR(noAns.length)} بدون إجابة (أرقام: ${noAns.map(q=>AR(q.n)).join("، ")}) — لن تُضاف</span>`:"")
      + (bad.length?`<br><span class="parse-bad">⚠ ${AR(bad.length)} بدون خيارات كافية — لن تُضاف</span>`:"") : "";
    $("#bOk").disabled=!ok.length; $("#bOk").textContent = ok.length?`إضافة ${AR(ok.length)} سؤال`:"إضافة";
  };
  $("#bText").oninput=upd; $("#bCancel").onclick=closeLayer;
  $("#bOk").onclick=()=>{
    const s = $("#bSec")?$("#bSec").value:secs[0].id; let n=0;
    parsed.filter(q=>q.o.length>=2&&q.a>=0&&q.a<q.o.length).forEach(p=>{ insertInSection(E,{id:newQid(E),s,q:p.q,o:p.o,a:p.a}); n++; });
    markExam(view.id); closeLayer(); renderEditor(); toast(`أُضيف ${AR(n)} سؤال ✓`);
  };
}

/* ======================== SAVE / PUBLISH ======================== */
function updateSaveBar(){
  let bar = $("#savebar");
  if(!bar){ bar=document.createElement("div"); bar.className="savebar"; bar.id="savebar"; document.body.appendChild(bar); }
  const n = dirtyCount();
  bar.innerHTML = `<div class="in"><span class="msg">${n?`<b>● تغييرات غير منشورة</b><br>اضغط «نشر» ليراها الطلاب`:"✓ كل شيء منشور"}</span>
    <button class="btn primary" id="pubBtn" ${n?"":"disabled style='opacity:.5'"}>نشر التغييرات</button></div>`;
  $("#pubBtn").onclick = publish;
}
async function publish(){
  for(const [id,e] of Object.entries(EXAMS)){
    if(!e.dirty) continue;
    if(!e.data.title.trim()){ toast("اسم الامتحان لا يمكن أن يكون فارغًا"); return; }
    if(e.data.sections.some(s=>!s.name.trim())){ toast("اسم القسم لا يمكن أن يكون فارغًا"); return; }
  }
  const steps=[];
  $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="modal"><div class="spinner" style="margin:0 auto 10px" id="pSpin"></div><h3 id="pTitle">جاري النشر…</h3><div class="progress-log" id="pLog"></div><div class="row" id="pRow" style="display:none;margin-top:14px"><button class="btn primary" id="pDone">تم</button></div></div></div>`;
  const log = t => { steps.push(t); $("#pLog").innerHTML = steps.join("<br>"); };
  try{
    for(const [id,e] of Object.entries(EXAMS)){
      if(!e.dirty) continue;
      log("حفظ «"+esc(e.data.title)+"»…");
      const r = await writeFile("exams/"+id+".json", JSON.stringify(e.data,null,1), e.sha, `تحديث امتحان: ${e.data.title}`);
      e.sha = r.content.sha; e.dirty=false; e.isNew=false;
      const m = IDX.exams.find(x=>x.id===id); if(m){ m.v=(m.v||1)+1; m.count=e.data.questions.length; }
    }
    for(const id of deleted.slice()){
      log("حذف امتحان…");
      await deleteFile("exams/"+id+".json", null, "حذف امتحان");
      deleted = deleted.filter(x=>x!==id);
    }
    log("تحديث قائمة الامتحانات…");
    const r = await writeFile("exams.json", JSON.stringify(IDX,null,1), IDX_SHA, "تحديث قائمة الامتحانات");
    IDX_SHA = r.content.sha; dirtyIndex=false;
    $("#pSpin").remove(); $("#pTitle").textContent="✓ تم النشر";
    log("<b>ستظهر التغييرات للطلاب خلال دقيقة تقريبًا.</b>");
  }catch(err){
    $("#pSpin").remove(); $("#pTitle").textContent="تعذّر النشر";
    log(`<span style="color:var(--bad)">${err.status===401?"انتهت صلاحية رمز الدخول، سجّل الدخول من جديد":err.status===403?"الرمز لا يملك صلاحية التعديل":"تأكد من الإنترنت وحاول مرة ثانية"}</span>`);
  }
  $("#pRow").style.display=""; $("#pDone").onclick=()=>{ closeLayer(); view.name==="edit"?renderEditor():renderDash(); };
  updateSaveBar();
}

/* ======================== BOOT ======================== */
async function boot(){
  if(!TOKEN){ renderLogin(); return; }
  $("#app").innerHTML = `<div class="loading"><div class="spinner"></div>جاري التحميل…</div>`;
  try{
    const f = await readFile("exams.json");
    IDX = JSON.parse(f.text); IDX_SHA = f.sha; IDX.site = IDX.site||{}; IDX.exams = IDX.exams||[];
    renderDash();
  }catch(e){
    if(e.status===401||e.status===403||e.status===404){ store.del(TOKEN_KEY); TOKEN=""; renderLogin(e.status===401?"انتهت صلاحية الرمز، أدخله من جديد":"الرمز لا يملك صلاحية على هذا الموقع"); }
    else $("#app").innerHTML = `<div class="card err">تعذّر الاتصال. <button class="btn ghost" onclick="location.reload()" style="margin-top:10px">أعد المحاولة</button></div>`;
  }
}
boot();
</script>
