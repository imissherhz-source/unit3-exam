<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان الوحدة الثالثة — 100 سؤال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ef; --surface:#ffffff; --surface-2:#fbf8f5; --ink:#211a22; --muted:#6f6470; --line:#e8e0e3;
  --brand:#8a1d5c; --brand-2:#b4317a; --brand-soft:#f6e6ef; --ok:#1f8a5b; --ok-soft:#e3f4ec; --bad:#c23b3b; --bad-soft:#fbe7e7;
  --warn:#c98a12; --shadow:0 1px 2px rgba(40,10,30,.05),0 8px 24px -12px rgba(40,10,30,.18); --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151116; --surface:#1f1920; --surface-2:#251e26; --ink:#f3ecf1; --muted:#a998a4; --line:#352b35;
  --brand:#e05aa3; --brand-2:#f27dbb; --brand-soft:#3a2032; --ok:#3fbf87; --ok-soft:#173327; --bad:#ef6b6b; --bad-soft:#3a1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* start */
.hero{padding:28px 22px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:99px}
h1{font-family:"Noto Naskh Arabic",serif;font-size:30px;margin:12px 0 4px;line-height:1.35}
.sub{color:var(--muted);margin:0;font-size:15px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:88px}
.stat b{display:block;font-size:20px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.section-title{font-weight:700;font-size:15px;margin:22px 4px 10px;color:var(--muted)}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:right;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:.15s}
.choice .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:18px;flex:none}
.choice b{display:block;font-size:15px}
.choice small{color:var(--muted);font-size:12.5px}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice[aria-pressed="true"] .ic{background:var(--brand);color:#fff}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-top:10px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{right:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-weight:700;font-size:16px;transition:.15s}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 20px -10px var(--brand)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn.block{width:100%}
.resume{margin-top:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-color:var(--brand)}
/* quiz */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.topbar .in{max-width:760px;margin:0 auto}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.progress{height:6px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .3s}
.qcard{padding:20px 18px;margin-top:16px}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.flag{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.qnum{font-size:13px;color:var(--muted);font-weight:600}
.qtext{font-family:"Noto Naskh Arabic",serif;font-size:20px;font-weight:600;line-height:1.85;margin:4px 0 16px;white-space:pre-line}
.qtext .quote{display:block;background:var(--surface-2);border-right:4px solid var(--brand);padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:18.5px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16.5px;line-height:1.7;transition:.15s}
.opt .L{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.opt:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .L{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{flex:1;padding:13px 10px}
.navbar .btn.grid{flex:0 0 56px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,8,16,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:760px;max-height:82vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
.sheet h3{margin:0 0 4px;font-size:18px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-left:4px}
.grid10{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.cell{height:42px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:var(--surface);position:relative}
.cell.ans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.cell.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.cell.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.fl::after{content:"";position:absolute;top:4px;left:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.grid-head{font-weight:700;font-size:14px;color:var(--muted);margin:14px 0 8px}
.modal{background:var(--surface);border-radius:20px;padding:22px;max-width:380px;width:calc(100% - 32px);margin:auto;align-self:center;text-align:center;animation:pop .2s}
.modal h3{margin:0 0 6px}
.modal p{color:var(--muted);margin:0 0 18px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes pop{from{transform:scale(.95);opacity:0}}
/* results */
.result-hero{padding:26px 18px;text-align:center}
.ring{width:170px;height:170px;margin:6px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-size:40px;line-height:1}
.ring .val span{color:var(--muted);font-size:14px;margin-top:4px}
.grade{font-family:"Noto Naskh Arabic",serif;font-size:24px;font-weight:700;margin:4px 0}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.bd{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.bd b{display:block;font-size:22px}
.bd span{font-size:12.5px;color:var(--muted)}
.secbars{margin-top:14px;padding:16px}
.sb{margin:6px 0 14px}
.sb:last-child{margin-bottom:4px}
.sb .h{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px;margin-bottom:6px}
.sb .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tabs{display:flex;gap:8px;margin:22px 0 12px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;background:var(--surface)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{padding:16px;margin-bottom:10px}
.rv .qtext{font-size:17px;margin-bottom:10px}
.rv .opt{font-size:15px;padding:10px 12px}
.rv .opt .L{width:28px;height:28px}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.no{background:var(--bad-soft);color:var(--bad)}.status.skip{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:30px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:420px){h1{font-size:25px}.qtext{font-size:18.5px}.opt{font-size:15.5px}.choices.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- START -->
<section id="start" class="wrap">
  <div class="card hero">
    <span class="eyebrow">شامل الوحدة الثالثة</span>
    <h1>امتحان «فيض العدوى» والمبتدأ والخبر</h1>
    <p class="sub">الدكتور منذر الدّروع · الأستاذ أسامة الأعرج</p>
    <div class="stats">
      <div class="stat"><b>١٠٠</b><span>سؤال</span></div>
      <div class="stat"><b>٥٠</b><span>نصوص</span></div>
      <div class="stat"><b>٥٠</b><span>قواعد</span></div>
    </div>
  </div>
  <div id="resumeBox"></div>

  <div class="section-title">اختر القسم</div>
  <div class="choices" id="secChoices">
    <button class="choice" data-sec="all" aria-pressed="true"><span class="ic">📚</span><span><b>الامتحان كاملًا</b><small>١٠٠ سؤال — نصوص وقواعد</small></span></button>
    <div class="choices two">
      <button class="choice" data-sec="t" aria-pressed="false"><span class="ic">📖</span><span><b>قسم النصوص</b><small>٥٠ سؤالًا</small></span></button>
      <button class="choice" data-sec="g" aria-pressed="false"><span class="ic">✍️</span><span><b>قسم القواعد</b><small>٥٠ سؤالًا</small></span></button>
    </div>
  </div>

  <div class="section-title">طريقة الحل</div>
  <div class="choices two" id="modeChoices">
    <button class="choice" data-mode="exam" aria-pressed="true"><span class="ic">📝</span><span><b>وضع الامتحان</b><small>النتيجة في النهاية</small></span></button>
    <button class="choice" data-mode="practice" aria-pressed="false"><span class="ic">💡</span><span><b>وضع التدريب</b><small>تصحيح فوري لكل سؤال</small></span></button>
  </div>

  <div class="card toggle-row">
    <span><b style="font-size:15px">ترتيب عشوائي للأسئلة</b><br><small style="color:var(--muted)">حتى لا تحفظ الترتيب</small></span>
    <button class="switch" id="shuffleSw" role="switch" aria-checked="false" aria-label="ترتيب عشوائي"></button>
  </div>

  <div style="margin-top:20px"><button class="btn primary block" id="startBtn">ابدأ الامتحان ←</button></div>
  <p class="foot">الإجابات معتمدة من الإجابات النموذجية في الملف</p>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="topbar"><div class="in">
    <div class="tb-row">
      <span class="pill" id="counter">١ / ١٠٠</span>
      <span class="pill" id="scorePill" style="display:none"></span>
      <span class="pill">⏱ <span id="timer">00:00</span></span>
      <button class="pill" id="finishTop" style="color:var(--brand);border-color:var(--brand)">إنهاء</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div class="card qcard" id="qcard"></div>
  </div>
  <div class="navbar"><div class="in">
    <button class="btn ghost" id="prevBtn">→ السابق</button>
    <button class="btn ghost grid" id="gridBtn" aria-label="خريطة الأسئلة">▦</button>
    <button class="btn primary" id="nextBtn">التالي ←</button>
  </div></div>
</section>

<!-- RESULTS -->
<section id="results" class="wrap hidden"></section>

<div id="layer"></div>

<script>
const KEY_T = "ج ب د ب أ ج ج د أ د ب ب ج ب ب ب ج أ ج أ ج ب د ب ب ج ب ج ج ب ب د ب أ ب أ د ج أ د ج أ ج ج ج ب د د أ د".split(" ");
const KEY_G = "ج أ ب د ب ج أ ب أ ج د ب ج أ ب د أ ج ب د د أ ب ج أ د ج ب أ د ب ج أ أ ج د أ ج ب د أ أ ب د أ ج ب أ د د".split(" ");

const TEXTS = [
["الفنّ النثريّ الذي ينتمي إليه نصّ (فيض العدوى):",["خاطرة","مذكّرات","مقالة علميّة","قصّة قصيرة"]],
["الكتاب الذي أُخذ منه نصّ (فيض العدوى) وقام بترجمته مصطفى إبراهيم فهمي:",["الأدبيّات العلميّة: جائحة الوباء العالمي القادمة (جون ميلر)","الفيض: أمراض الحيوانات المعدية، وجائحة الوباء التالية بين البشر (ديفيد كوامن)","الفيروسات المراوغة: استراتيجية الكمون في العائل الخازن (روبرت ستون)","أمراض العصر: فيض العدوى واستئصال الأمراض الحيوانية (مايكل براون)"]],
["الفرق بين المفترسات والمُمرِضات من حيث تعامل كلٍّ منها مع الفرائس:",["المفترسات وحوش كبيرة نسبيًا تأكل فرائسها من الداخل، والممرضات كائنات دقيقة تأكل فرائسها من الخارج.","الممرضات تتخذ من الكائن الحي عائلًا خازنًا تفترسه من الخارج، والمفترسات تفترسه من الداخل.","الممرضات تهاجم الكائن الحي من الخارج بوصفها كيانًا معديًا، والمفترسات تأكل فرائسها من الداخل.","المفترسات وحوش كبيرة نسبيًا تأكل فرائسها من الخارج، والممرضات وحوش صغيرة تفترسها من الداخل."]],
["(هَلْ يُمْكِنُ لِشَيْءٍ لا يُرى أَنْ يُحيطَ بِنا، وَأَنْ يَكونَ قادِرًا عَلى أَنْ يَهْزِمَ مَدينَةً كامِلَةً؟)\nالأثر الفنيّ الذي حقّقه افتتاح النصّ بأسلوب الاستفهام:",["تقرير حقيقة قدرة الأمراض على هزيمة المدن وتأكيد انتشارها السريع.","جذب الانتباه وإثارة الفضول للتفكير في خطورة الممرضات وقدرتها على الانتشار.","نفي إمكانية رؤية الكائنات الدقيقة التي تسبب الأمراض المعدية وتدميرها.","التعجب من قدرة الكائنات الصغيرة على إرساء نفسها داخل فرائسها من الخارج."]],
["ما يترتّب على (وثوب جرثومةٍ من أحد الحيوانات إلى البشر، وإرساء نفسها فيه):",["حدوث مرضٍ حيوانيّ مشترك؛ ممّا قد يسبّب المرض أو الموت للإنسان.","تحوّل الجرثومة إلى سلالةٍ غير مُعدية تزول مع الوقت.","القضاء التامّ على الناقل الحيوانيّ الأصليّ للجرثومة.","ضعف شدّة الفيروس وتلاشيه داخل الخلايا البشريّة."]],
["معنى كلمة (الكيان) في عبارة: (وَتَنْجَحُ في إرساءِ نَفْسِها فيهِ بِوَصْفِها كِيانًا مُعْدِيًا):",["التجدّد والنموّ","الاستقرار والتثبّت","الذات والوجود","القدرة والتأثير"]],
["القرون في عبارة: على الرغم من الجهود التي بُذلت على مدى قرون، مفردها قرن، ويعني:",["عشرة أعوام.","خمسة وعشرين عامًا.","مئة عام.","ألف عام."]],
["كلّ ممّا يأتي يترتّب على (فهم مصطلح المرض الحيوانيّ المشترك، أو المرض ذي المنشأ الحيوانيّ)، ما عدا:",["معرفة شيء جوهري عن أصول بعض الأمراض القاتلة في هذا العصر.","فهم عناوين تشير إلى التهديد بجائحة وباء عالمي.","فهم أسماء أمراض كإنفلونزا الخنازير وإنفلونزا الطيور وجنون البقر.","السيطرة التامة على حركة الحيوانات داخل أسواق الحيوانات الحية."]],
["وصف الكاتب مصطلح \"المرض الحيوانيّ المشترك\" بأنّه يبدو من المستقبل؛ لأنّ:",["مصيره الاستعمال بكثافة في القرن الحادي والعشرين.","حتمية اختفاء هذه الأمراض سيكون في المستقبل القريب بفضل الطب.","العلماء لم يستطيعوا التعامل معه في الماضي.","قدرته على التحوّل إلى وباء لا يصيب إلا الأجيال القادمة."]],
["(تَبَيَّنَ أَنَّ مَصْدَرَها الأَصْلِيَّ طَيْرٌ مائِيٌّ بَرِّيٌّ، وَقَدْ تَسَبَّبَتْ في وَفاةِ خَمْسَةِ مَلايينِ إِنْسانٍ قَبْلَ أَنْ تَتَراجَعَ إِلى الْخَفاءِ).\nالإحالة التاريخية في هذه العبارة تعود إلى:",["جائحة فيروس كورونا عام ٢٠١٩م.","جميع أنواع الإنفلونزا البشرية المتناثرة.","إنفلونزا الطيور التي انبثقت مؤخرًا.","الإنفلونزا في العامين ١٩١٨-١٩١٩م."]],
["المقصود بكلمة (جائحة) في عبارة: (وَأَنْ نَفْهَمَ عَناوينَ تُشيرُ إِلى التَّهْديدِ بِجائِحَةِ وَباءٍ عالَمِيٍّ):",["المرض المحدود الذي يصيب فئة قليلة من الناس.","الوباء العظيم، والمصيبة التي تحلّ بالناس.","الكارثة الطبيعية كالزلازل والبراكين فقط.","الانخفاض المفاجئ في درجات الحرارة."]],
["يختلف (داء الكَلَب) عن النوع الآخر من الأمراض (الجديدة المتناثرة على نحوٍ لم يُفسَّر) في كونه:",["متناثرًا يصيب عددًا قليلًا ويختفي، بينما الجديدة تنتشر على نحو رهيب.","منتشرًا ومميتًا على نحو رهيب ويقتل بالآلاف، بينما الجديدة تصيب ضحايا قليلين وتختفي لسنوات.","يختبئ داخل العائل الخازن بشكل مستتر، بينما الجديدة تقيم كامنة في الرياح.","يعكس مفعول جرثومة قاتلة، بينما الجديدة لم تنجح في إرساء نفسها بوصفها كيانًا معديًا."]],
["الصفة التي يتميّز بها \"العائل الخازن\" بالنسبة للمرض الذي يحمل جرثومته هي أنّه:",["يعاني من أعراضه المرضية بشدّة.","يموت فور دخول الجرثومة إلى جسده.","لا يعاني هو من المرض.","يتعافى من الجرثومة بعد فترة قصيرة."]],
["يُعرَّف \"العائل الخازن\" بأنّه:",["كائن حيّ ينقل المرض ويعاني من أعراضه بشكل حادّ.","كائن حيّ يحمل الجرثومة المرضية ويؤويها على نحو مزمن، بينما لا يعاني هو من المرض.","جرثومة مرضية تنتشر سريعًا في الهواء والماء.","كائن حيّ يقضي على الجرثومة المرضية في جسده نهائيًا."]],
["المقصود بـ \"استراتيجية الكمون\" هو:",["القضاء التامّ على الجراثيم داخل الكائن الحيّ.","بقاء الجراثيم كامنة داخل العائل الخازن حتى تُتاح لها فرصة الانتقال والانتشار من جديد.","سرعة انتشار الجراثيم المباشرة بين الكائنات دون سكون.","تحوّل الجراثيم إلى كائنات نافعة داخل العائل الخازن."]],
["مفرد كلمة (الجُرذان) ومعناها:",["جَرذة، وهو الصغير من الفئران.","جُرَذ، وهو الكبير من الفئران.","جَريذ، وهو نوع من الزواحف.","جِرذ، وهو الفأر المائي."]],
["(لَكِنَّهُ سَيَظْهَرُ عِنْدَما تَعودُ بِهِ الرّيحُ مِنْ مَكانٍ آخَرَ، أَوْ رُبَّما يَكونُ لا يَزالُ يَتَسَكَّعُ عَنْ قُرْبٍ).\nتفسّر العبارة السابقة سلوك المرض في مرحلة:",["التكاثر داخل الكيان المعدي.","الاكتساح الوبائي الشامل.","الاختفاء المؤقت وعدم الزوال التام.","المقاومة والعلاج الطبي."]],
["المقصود بـ(يتسكّع) في عبارة \"يَتَسَكَّعُ عَنْ قُرْبٍ، هُنا وَهُناكَ، داخِلَ عائِلٍ خازِنٍ\":",["يتجوّل ويدور بلا هدف.","يتربّص بفرائسه بوعي كامل.","يتكاثر بأعداد ضخمة وسريعة.","يختبئ وينتظر الفرصة للقضاء على العائل."]],
["تُعدّ الفيروسات أكثر الجراثيم الممرضة خطرًا للأسباب الآتية، ما عدا:",["قدرتها على التطوّر السريع والمستمر.","إحداثها معدلات عالية من الوفيات.","امتلاكها وسيلة نقل تخصّها للسباحة والجري.","مراوغتها وعدم تأثّرها بالمضادات الحيوية."]],
["المقصود بقول الكاتب: (الفيروسات لا تستطيع أن تجري، ولا أن تمشي، ولا أن تسبح، لكنّها تركب):",["أنّ الفيروسات لا تتحرّك بنفسها، برًّا أو بحرًا، لكنّها تنتقل بوساطة الكائنات الحيّة ووسائل النقل.","فشل الفيروسات في التنقل الذاتي مما يحدّ من قدرتها على الوصول للبشر.","امتلاك الفيروسات أعضاء خاصّة تساعدها على الحركة والتنقّل الذاتي.","عجز الفيروسات التام عن إحداث العدوى خارج العائل الخازن."]],
["(الفيروسات لا تستطيع أن تجري، ولا أن تمشي، ولا أن تسبح، لكنّها تركب) غرض الكاتب من العبارة السابقة:",["ضعف الفيروسات وسهولة القضاء عليها.","أنّ الفيروسات كائنات بطيئة الانتقال لا تستطيع قطع المسافات البعيدة بين الدول.","سرعة انتشار الفيروسات، وخفاؤها، وخطورتها في العالم.","كيفية تكاثر الفيروسات داخل جسد المريض."]],
["جمال التصوير في قول العالِم (ستيفن مورس): «الفيروسات ليس لديها وسيلة تنقّل تخصّها، بيد أنّ كثيرًا منها يسافر حول العالم» هو أنّه صوّر الفيروسات بـ:",["كائنات ضعيفة لا قدرة لها على الحركة أو التأثير.","المسافر الذي ينتقل بين البلدان.","آلات حديثة تتنقل بسرعة فائقة عبر الحدود.","طيور مهاجرة تبحث عن طعامها."]],
["الجذور اللغوية للكلمات الآتية: (محدقة، مراوغة، سينبثق) على الترتيب:",["حدي، ريغ، نبق.","دقق، مرغ، بثق.","حدق، نبق، روغ.","حدق، روغ، بثق."]],
["(نجد في الأدبيات العلمية أنّه إذا كان ثمّة وباء كبير قادم فإنّه سيكون مرضًا حيوانيًا مشتركًا) المقصود بـ\"الأدبيات العلمية\" هو:",["المقالات الأدبية والقصائد التي تتناول القضايا العلمية.","مجموعة المنشورات العلمية في التخصّصات كافّة.","الكتب التاريخية التي توثّق نشأة العلوم القديمة.","الأبحاث الطبية المتخصّصة في الأمراض الحيوانية فقط."]],
["تشير الأدبيات العلمية إلى أنّ الوباء الكبير القادم سيكون:",["مرضًا يقتصر أثره على الحيوانات فقط.","مرضًا حيوانيًا مشتركًا.","مرضًا بكتيريًا ينتقل عبر المياه الملوّثة.","مرضًا ناتجًا عن التغيّرات المناخية المباشرة."]],
["الحادثة الواقعية التي أخرجت تحذيرات عالم الوبائيات (دونالد س. بيرك) من دائرة الاحتمالات النظرية إلى الواقع الملموس:",["جائحة الإنفلونزا عام ١٩١٨م والتي حصدت خمسة ملايين ضحية.","قدرة فيروس الإيدز على المراوغة في القرن الحادي والعشرين.","ظهور فيروس كورونا عام ٢٠١٩م وتحوّله إلى جائحة عالمية غير مسبوقة.","تفشي داء الكلب وجدري القردة في أسواق الحيوانات الحية."]],
["المقصود بالكلمة المخطوط تحتها في عبارة: (وبذلك نوفّر فرصةً لـ«فيض» العدوى):",["زوال","انتشار","إيقاف","كشف"]],
["تكمن أهمية (استشراف المستقبل) في مواجهة الجوائح في كل ما يأتي، ما عدا:",["الاستعداد المبكر لتطوير الأنظمة الصحية الاستيعابية.","نشر الوعي الصحي لتقليل انتقال وانتشار العدوى.","الاستسلام للكوارث الوبائية بوصفها خارج نطاق تحكم البشر.","وضع خطط للاستجابة السريعة والحد من الخسائر البشرية والاقتصادية."]],
["(يَنْبَغي لَنا أَنْ نُدْرِكَ أَنَّ هَذِهِ الأَوْبِئَةَ... تَنْجُمُ عَنْ عَوامِلَ قَدْ يُسَبِّبُها الإِنْسانُ، وَتَقَعُ في نِطاقِ تَحَكُّمِنا).\nيقصد بكلمة (نطاق) في هذا السياق:",["القدرة الجسدية.","البصيرة والفطنة.","الدائرة والحدود.","الاستشراف واليقظة."]],
["الذي يُعدّ خطّ الدفاع الأوّل في مواجهة الوباء أو الجائحة:",["الكوادر الطبية والأدوية المتطوّرة.","وعي الأفراد والمجتمعات، وسرعة الاستجابة.","المشافي الميدانية والأبحاث العلمية.","الإغلاقات الاقتصادية والقوانين الصارمة."]],
["الدور الأساسي لوعي الأفراد والتزامهم بالإجراءات الصحية في مواجهة الأوبئة هو:",["القضاء التامّ على الجراثيم.","الحدّ من انتشار الأوبئة وتقليل انتقال العدوى.","انتهاء الحاجة إلى الرعاية الطبية والعلاج.","سرعة إنتاج المطاعيم واللقاحات المضادة."]],
["كلّ ممّا يأتي من العوامل التي تزيد فرصة (فيض العدوى)، ما عدا:",["زيارة مضامير السباق وكهوف الخفافيش.","الإقامة في فنادق تحوي مرضى غرباء.","العيش بكثافات سكانية عالية في مدن كثيرة.","عدم تناول المضادات الحيوية عند الشعور بالمرض."]],
["(وَنَزورُ أَسْواقَ الحَيَواناتِ الحَيَّةِ، وَكُهوفَ الخَفافيشِ، وَمَضاميرَ السِّباقِ) مفرد كلمة (مضامير) ومعناها:",["ضمير، وهو السريرة والباطن.","مِضمار، وهو ميدان السباق.","مُضمَر، وهو المكان الضيّق.","ضامِر، وهو الشيء النحيف."]],
["المعنى البلاغيّ الذي خرج إليه أسلوب الاستفهام في عبارة: مَن الذي يستطيع أن يجادل في ذلك؟ هو:",["النفي.","التعجّب.","التقرير.","التهكّم."]],
["المقصود بكلمة (كَبْح) في قول الكاتب «إنّ سلوك الناس مهمّ جدًّا في كبح انتشار المرض المعدي» هو:",["الإسراع والتشجيع.","الإيقاف والمنع.","التغيير والتبديل.","الكشف والتشخيص."]],
["الغرض الرئيس الذي سعى الكاتب إلى إبرازه من خلال مقارنته بين الإنسان والفراش هو:",["أنّ الإنسان يمتاز ببصيرته، وقدرته على التفكير بوعي، بخلاف الفراش الذي يتحرّك بدافع الغريزة.","إظهار التشابه السلوكي بين الإنسان والفراش عند التعرّض للمخاطر الصحيّة.","التأكيد على أنّ العواطف والغرائز هي المحرّك الأوّل لقرارات الإنسان والحيوان.","إثبات العجز البشري أمام الأوبئة مقارنةً بسرعة تكيّف الكائنات الأخرى."]],
["(لَعَلَّ هَذا يَبْدو مُضْجِرًا؛ فَما يَعْنيهِ ذَلِكَ هُوَ أَنَّ الجُهْدَ الفَرْدِيَّ...). كلمة (مضجرًا) تدل على أنّ الأمر:",["مدهش ويبعث على التفاؤل.","مرعب ويفوق قدرة تحمّل البشر.","غامض ويصعب استيعابه.","مملّ وباعث على الضيق."]],
["الصورة الفنية في عبارة (أَوْ أَلّا يَسْقُطَ في وَحْلِ الْمُخَدِّراتِ وَإِبَرِ حَقْنِها الْمُلَوَّثَةِ):",["شبّه إبر المخدرات بجرثومة كامنة تهاجم الجسد من الداخل كالوحوش.","شبّه المخدرات بوحل يسهل غسله بمجرد تطبيق الفطنة الفردية.","شبّه المخدرات وحلًا يسقط فيه الإنسان، ويصعب الخروج منه.","شبّه الأمراض الحيوانية المشتركة بالوحل الذي تتكاثر فيه الجراثيم."]],
["جميع الآتية من سمات المقالة العلمية كما ظهرت في نص (فيض العدوى) ما عدا:",["العاطفة الجياشة والإغراق في التخيلات الرمزية المبهمة.","استخدام المصطلحات العلمية كالمرض الحيواني المشترك والعائل الخازن.","الاستناد إلى الحقائق والإحصائيات كعدد ضحايا إنفلونزا عام ١٩١٨م.","الاعتماد على التفسير والتعليل وربط الأسباب بالنتائج كتفسير أسباب انتشار العدوى."]],
["يُعدّ الشرح من سمات المقالة العلميّة، كلّ ممّا يأتي يمثّل هذه السمة، ما عدا:",["\"نعيش بكثافات عالية في مدن كثيرة، نكثّر آلافًا من الماشية والدواجن، كلها محبوسة بأعداد ضخمة..\"","\"نقيم في فنادق فيها غرباء مرضى\"","\"نزور أسواق الحيوانات الحيّة، وكهوف الخفافيش...\"","ذكر جائحة الإنفلونزا في عامي (١٩١٨-١٩١٩م)، ووفاة ملايين البشر بسببها."]],
["\"ثم نثِبُ إلى الطائرات، ونطير عائدين إلى الوطن، وبذلك نوفّر فرصةً لفيض العدوى التي سرعان ما تتحوّل إلى جائحة وبائية\"\nالسّمة الواردة في العبارة السابقة من سمات المقالة العلمية:",["الاستناد إلى الحقائق العلمية","الشرح","التدرّج المنطقيّ","الاعتماد على التفسير والتعليل وربط الأسباب بالنتائج"]],
["من سمات المقالة العلميّة (الاستناد إلى الحقائق العلمية)، العبارة التي تمثّل هذه السّمة:",["ذكر جائحة الإنفلونزا في عامي (١٩١٨-١٩١٩م)، ووفاة ملايين البشر بسببها","\"نقيم في فنادق فيها غرباء مرضى\"","\"نزور أسواق الحيوانات الحيّة، وكهوف الخفافيش...\"","نعيش بكثافات عالية في مدن كثيرة"]],
["يُعدّ استخدام المصطلحات العلمية من سمات المقالة العلميّة، كلّ ممّا يأتي يمثّل هذه السمة ما عدا:",["المرض الحيواني المشترك","الفيروسات","أسباب انتشار العدوى.","العائل الخازن"]],
["ورد مرض (الإيدز) في النص كدليل على:",["سرعة تحول الفيروسات إلى جائحة تقتل خمسة ملايين إنسان سنويًا.","قدرة العائل الخازن على التسكع والاختفاء لسنوات في أسواق الحيوانات.","مسؤولية السلوك البشري المباشرة في نقل الفيروس، وأنه يمثل مرضًا ذا منشأ حيواني.","فشل الأدبيات العلمية في استشراف المستقبل والتنبؤ بانبثاق الفيروسات الوشيكة."]],
["المقصود بكلمة (مُحدِقة) في عبارة: «إنّ الأخطار التي يطرحها المرض الحيوانيّ المشترك مُحدِقةٌ وشديدةٌ»:",["مخفيّة","مميتة","محيطة","بطيئة"]],
["الجذر اللغوي للكلمات (الناجمة، وشيكة، متيقظين) على الترتيب:",["نجو، شيك، يقظ.","نجم، وشك، يقظ.","نجم، شوك، قيظ.","نجو، وشك، قظظ."]],

  ...TEXTS.map((q,i)=>({id:"t"+(i+1),sec:"t",n:i+1,text:q[0],opts:q[1],ans:LET.indexOf(KEY_T[i])})),
  ...GRAMMAR.map((q,i)=>({id:"g"+(i+1),sec:"g",n:i+1,text:q[0],opts:q[1],ans:LET.indexOf(KEY_G[i])}))
];
const SECNAME = {t:"النصوص", g:"القواعد"};
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SKEY = "unit3-exam-v1";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let cfg = {sec:"all", mode:"exam", shuffle:false};
let S = null; // {ids, answers:{}, flags:{}, i, elapsed, mode, sec, done}
let tick = null;

function fmt(s){const m=Math.floor(s/60), x=s%60; return AR(String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"));}
function qById(id){return ALL.find(q=>q.id===id)}
function show(id){["start","quiz","results"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id)); window.scrollTo(0,0);}

/* ---- start screen ---- */
function pick(groupSel, attr, val){
  document.querySelectorAll(groupSel+" [data-"+attr+"]").forEach(b=>b.setAttribute("aria-pressed", b.dataset[attr]===val));
}
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{cfg.sec=b.dataset.sec;pick("#secChoices","sec",cfg.sec)});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;pick("#modeChoices","mode",cfg.mode)});
$("#shuffleSw").onclick=e=>{cfg.shuffle=!cfg.shuffle;e.currentTarget.setAttribute("aria-checked",cfg.shuffle)};
$("#startBtn").onclick=()=>{
  let ids = ALL.filter(q=>cfg.sec==="all"||q.sec===cfg.sec).map(q=>q.id);
  newSession(ids, cfg.mode, cfg.sec);
};
function newSession(ids, mode, sec){
  if(cfg.shuffle){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}
  S = {ids, answers:{}, flags:{}, i:0, elapsed:0, mode, sec, done:false};
  save(); startQuiz();
}
function renderResume(){
  const s = store.get(SKEY); const box = $("#resumeBox");
  if(s && !s.done && s.ids && Object.keys(s.answers).length){
    const n=Object.keys(s.answers).length;
    box.innerHTML = `<div class="card resume"><span><b>عندك امتحان لم يكتمل</b><br><small style="color:var(--muted)">أجبت ${AR(n)} من ${AR(s.ids.length)} · ${fmt(s.elapsed)}</small></span><span style="display:flex;gap:8px"><button class="btn ghost" id="discard" style="padding:10px 12px">حذف</button><button class="btn primary" id="resume" style="padding:10px 14px">أكمل</button></span></div>`;
    $("#resume").onclick=()=>{S=s;startQuiz()};
    $("#discard").onclick=()=>{store.del(SKEY);box.innerHTML=""};
  } else box.innerHTML="";
}
function save(){ if(S) store.set(SKEY,S); }

/* ---- quiz ---- */
function startQuiz(){
  show("quiz"); renderQ();
  clearInterval(tick);
  tick = setInterval(()=>{S.elapsed++; $("#timer").textContent=fmt(S.elapsed); if(S.elapsed%5===0) save();},1000);
  $("#timer").textContent=fmt(S.elapsed);
}
function renderQ(){
  const q = qById(S.ids[S.i]); const a = S.answers[q.id]; const total=S.ids.length;
  const practice = S.mode==="practice"; const locked = practice && a!==undefined;
  $("#counter").textContent = AR(S.i+1)+" / "+AR(total);
  const answered = Object.keys(S.answers).length;
  $("#prog").style.width = (answered/total*100)+"%";
  if(practice){
    const right = S.ids.filter(id=>S.answers[id]!==undefined && S.answers[id]===qById(id).ans).length;
    $("#scorePill").style.display=""; $("#scorePill").innerHTML = `✓ ${AR(right)} <span style="color:var(--muted)">·</span> ✗ ${AR(answered-right)}`;
  } else $("#scorePill").style.display="none";

  let txt = esc(q.text);
  const parts = txt.split("\n");
  if(parts.length>1) txt = `<span class="quote">${parts[0]}</span>${parts.slice(1).join("<br>")}`;

  let html = `<div class="qmeta"><span class="tag">${SECNAME[q.sec]} · س${AR(q.n)}</span>
    <button class="flag" id="flagBtn" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id]?"★ مُعلَّم":"☆ علّم للمراجعة"}</button></div>
    <div class="qtext">${txt}</div><div class="opts">`;
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(locked){ if(k===q.ans) cls+=" right"; else if(k===a) cls+=" wrong"; }
    else if(a===k) cls+=" sel";
    html += `<button class="${cls}" data-k="${k}" ${locked?"disabled":""}><span class="L">${LET[k]}</span><span>${esc(o)}</span></button>`;
  });
  html += `</div>`;
  if(locked){
    html += a===q.ans ? `<div class="feedback ok">✓ إجابة صحيحة، أحسنت!</div>`
                      : `<div class="feedback no">✗ الإجابة الصحيحة: (${LET[q.ans]}) ${esc(q.opts[q.ans])}</div>`;
  }
  $("#qcard").innerHTML = html;
  $("#qcard").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  $("#flagBtn").onclick=()=>{S.flags[q.id]=!S.flags[q.id]; if(!S.flags[q.id]) delete S.flags[q.id]; save(); renderQ();};
  $("#prevBtn").disabled = S.i===0; $("#prevBtn").style.opacity = S.i===0?.4:1;
  $("#nextBtn").textContent = S.i===total-1 ? "إنهاء وعرض النتيجة ✓" : "التالي ←";
}
function choose(k){
  const q = qById(S.ids[S.i]);
  if(S.mode==="practice" && S.answers[q.id]!==undefined) return;
  S.answers[q.id]=k; save(); renderQ();
  if(S.mode==="exam" && S.i < S.ids.length-1) setTimeout(()=>{ if(qById(S.ids[S.i]).id===q.id){S.i++;renderQ();window.scrollTo({top:0,behavior:"smooth"});} }, 260);
}
$("#prevBtn").onclick=()=>{ if(S.i>0){S.i--;save();renderQ();window.scrollTo(0,0);} };
$("#nextBtn").onclick=()=>{ if(S.i<S.ids.length-1){S.i++;save();renderQ();window.scrollTo(0,0);} else confirmFinish(); };
$("#finishTop").onclick=confirmFinish;
$("#gridBtn").onclick=openGrid;

function closeLayer(){ $("#layer").innerHTML=""; }
function openGrid(){
  const groups = {};
  S.ids.forEach((id,idx)=>{const q=qById(id);(groups[q.sec]=groups[q.sec]||[]).push([id,idx])});
  let h = `<div class="overlay" id="ov"><div class="sheet"><h3>خريطة الأسئلة</h3>
   <div class="legend"><span><i style="background:var(--brand-soft);border:1.5px solid var(--brand)"></i>مُجاب</span><span><i style="border:1.5px solid var(--line)"></i>لم يُجب</span><span><i style="background:var(--warn);border-radius:50%"></i>مُعلَّم</span></div>`;
  for(const sec of Object.keys(groups)){
    if(Object.keys(groups).length>1) h+=`<div class="grid-head">${SECNAME[sec]}</div>`;
    h+=`<div class="grid10">`;
    groups[sec].forEach(([id,idx])=>{
      const q=qById(id), a=S.answers[id];
      let c="cell";
      if(a!==undefined) c += S.mode==="practice" ? (a===q.ans?" r":" w") : " ans";
      if(S.flags[id]) c+=" fl"; if(idx===S.i) c+=" cur";
      h+=`<button class="${c}" data-idx="${idx}">${AR(idx+1)}</button>`;
    });
    h+=`</div>`;
  }
  h+=`<div style="margin-top:16px;display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="closeG">إغلاق</button><button class="btn primary" style="flex:1" id="finG">إنهاء الامتحان</button></div></div></div>`;
  $("#layer").innerHTML=h;
  $("#ov").onclick=e=>{if(e.target.id==="ov")closeLayer()};
  $("#closeG").onclick=closeLayer;
  $("#finG").onclick=()=>{closeLayer();confirmFinish()};
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{S.i=+b.dataset.idx;save();closeLayer();renderQ();window.scrollTo(0,0)});
}
function confirmFinish(){
  const left = S.ids.length - Object.keys(S.answers).length;
  $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <div style="font-size:40px">${left? "⚠️":"🎯"}</div>
    <h3>${left? "باقي "+AR(left)+" سؤال بدون إجابة":"جاهز لعرض النتيجة؟"}</h3>
    <p>${left? "الأسئلة غير المجابة تُحسب خطأ. متأكد أنك تريد الإنهاء؟":"أجبت عن كل الأسئلة."}</p>
    <div class="row"><button class="btn ghost" id="cBack">${left?"أكمل الحل":"رجوع"}</button><button class="btn primary" id="cGo">اعرض نتيجتي</button></div></div></div>`;
  $("#cBack").onclick=closeLayer; $("#cGo").onclick=()=>{closeLayer();finish()};
}

/* ---- results ---- */
let rvFilter="wrong";
function finish(){
  clearInterval(tick); S.done=true; save(); renderResults(); show("results");
}
function gradeOf(p){
  if(p>=95) return ["ممتاز جدًا! 🏆","أداء استثنائي، أنت جاهز تمامًا."];
  if(p>=85) return ["ممتاز 🌟","مستوى عالٍ، راجع الأخطاء القليلة فقط."];
  if(p>=75) return ["جيد جدًا 👏","قريب من القمة، ركّز على أخطائك."];
  if(p>=65) return ["جيد 👍","أساس جيد، المراجعة سترفعك كثيرًا."];
  if(p>=50) return ["مقبول","تحتاج مراجعة مركّزة للقسم الأضعف."];
  return ["تحتاج مراجعة 💪","راجع الدرس ثم أعد الأخطاء فقط."];
}
function renderResults(){
  const tot=S.ids.length;
  let right=0, wrong=0, skip=0; const per={};
  S.ids.forEach(id=>{const q=qById(id),a=S.answers[id];
    per[q.sec]=per[q.sec]||{r:0,t:0}; per[q.sec].t++;
    if(a===undefined) skip++; else if(a===q.ans){right++;per[q.sec].r++} else wrong++;});
  const pct = Math.round(right/tot*1000)/10;
  const [g,gs]=gradeOf(pct);
  const C=2*Math.PI*72, off=C*(1-right/tot);
  const color = pct>=75?"var(--ok)":pct>=50?"var(--warn)":"var(--bad)";
  let h = `<div class="card result-hero">
    <span class="eyebrow">${S.sec==="all"?"الامتحان كاملًا":"قسم "+SECNAME[S.sec]} · ${S.mode==="practice"?"تدريب":"امتحان"}</span>
    <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="none" stroke="var(--line)" stroke-width="14"/>
      <circle cx="85" cy="85" r="72" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="arc" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
      <div class="val"><b>${AR(right)}<span style="font-size:20px;color:var(--muted)">/${AR(tot)}</span></b><span>${AR(pct)}٪</span></div></div>
    <div class="grade">${g}</div><p class="sub">${gs}</p>
    <div class="breakdown">
      <div class="bd"><b style="color:var(--ok)">${AR(right)}</b><span>صحيحة</span></div>
      <div class="bd"><b style="color:var(--bad)">${AR(wrong)}</b><span>خاطئة</span></div>
      <div class="bd"><b>${fmt(S.elapsed)}</b><span>الوقت</span></div>
    </div>
    ${skip?`<p class="sub" style="margin-top:10px">${AR(skip)} بدون إجابة (محسوبة خطأ)</p>`:""}
  </div>`;
  if(Object.keys(per).length>1){
    h+=`<div class="card secbars">`;
    for(const s of Object.keys(per)){const p=per[s];h+=`<div class="sb"><div class="h"><span>${SECNAME[s]}</span><span>${AR(p.r)} / ${AR(p.t)} · ${AR(Math.round(p.r/p.t*100))}٪</span></div><div class="bar"><i style="width:${p.r/p.t*100}%"></i></div></div>`}
    h+=`</div>`;
  }
  h+=`<div class="actions">
    <button class="btn primary" id="retryWrong" ${wrong+skip?"":"disabled style='opacity:.5'"}>أعد الأخطاء (${AR(wrong+skip)})</button>
    <button class="btn ghost" id="again">امتحان جديد</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" data-f="wrong" aria-selected="${rvFilter==="wrong"}">الأخطاء (${AR(wrong+skip)})</button>
      <button class="tab" data-f="flag" aria-selected="${rvFilter==="flag"}">المُعلَّمة (${AR(Object.keys(S.flags).length)})</button>
      <button class="tab" data-f="all" aria-selected="${rvFilter==="all"}">كل الأسئلة</button>
    </div><div id="rvList"></div>`;
  $("#results").innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#arc").style.strokeDashoffset=off}));
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{rvFilter=t.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));renderReview()});
  $("#again").onclick=()=>{store.del(SKEY);S=null;renderResume();show("start")};
  $("#retryWrong").onclick=()=>{const ids=S.ids.filter(id=>S.answers[id]!==qById(id).ans);if(ids.length){const sec=S.sec;newSession(ids,S.mode,sec)}};
  renderReview();
}
function renderReview(){
  const list = S.ids.filter(id=>{const q=qById(id),a=S.answers[id];
    if(rvFilter==="wrong") return a!==q.ans; if(rvFilter==="flag") return S.flags[id]; return true;});
  if(!list.length){$("#rvList").innerHTML=`<div class="empty">${rvFilter==="wrong"?"🎉 لا توجد أخطاء!":"لا يوجد شيء هنا"}</div>`;return}
  $("#rvList").innerHTML = list.map(id=>{
    const q=qById(id), a=S.answers[id];
    const st = a===undefined?`<span class="status skip">بدون إجابة</span>`: a===q.ans?`<span class="status ok">صحيحة</span>`:`<span class="status no">خاطئة</span>`;
    let t=esc(q.text).split("\n"); t = t.length>1?`<span class="quote">${t[0]}</span>${t.slice(1).join("<br>")}`:t[0];
    return `<div class="card rv"><div class="qmeta"><span class="tag">${SECNAME[q.sec]} · س${AR(q.n)}</span>${st}</div>
      <div class="qtext">${t}</div><div class="opts">${q.opts.map((o,k)=>{
        let c="opt"; if(k===q.ans)c+=" right"; else if(k===a)c+=" wrong";
        return `<div class="${c}"><span class="L">${LET[k]}</span><span>${esc(o)}</span></div>`}).join("")}</div></div>`;
  }).join("");
}

/* init */
(function(){
  const s=store.get(SKEY);
  if(s && s.done && s.ids){S=s;renderResults();show("results");}
  else renderResume();
})();
</script>
</body>
</html>
