<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصّة الامتحانات</title>
<meta name="description" content="منصّة امتحانات تفاعلية: اختر الامتحان، حلّ أونلاين، واعرف نتيجتك فورًا مع مراجعة الأخطاء.">
<meta name="theme-color" content="#8a1d5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الامتحانات">
<meta property="og:type" content="website">
<meta property="og:title" content="منصّة امتحانات اللغة العربية">
<meta property="og:description" content="اختر الامتحان، حلّ أونلاين، واعرف نتيجتك فورًا">
<meta property="og:image" content="https://imissherhz-source.github.io/unit3-exam/og.png">
<meta property="og:url" content="https://imissherhz-source.github.io/unit3-exam/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css">
<link rel="preload" href="exams.json" as="fetch" crossorigin>
</head>
<body>

<!-- HOME -->
<section id="home" class="wrap">
  <div class="card hero">
    <span class="eyebrow" id="siteEyebrow">منصّة الامتحانات</span>
    <h1 id="siteTitle">منصّة الامتحانات</h1>
    <p class="sub" id="siteSub"></p>
    <p class="sub" id="siteTeacher" style="margin-top:6px;font-weight:600"></p>
  </div>
  <div class="section-title">اختر الامتحان</div>
  <div id="examList" class="exam-list"><div class="loading"><div class="spinner"></div>جاري التحميل…</div></div>
  <a class="teacher-link" href="admin.html">🔒 لوحة الأستاذ</a>
</section>

<!-- START (per exam) -->
<section id="start" class="wrap hidden">
  <button class="back" id="backHome">→ كل الامتحانات</button>
  <div class="card hero">
    <span class="eyebrow" id="exEyebrow">امتحان</span>
    <h1 id="exTitle"></h1>
    <p class="sub" id="exDesc"></p>
    <div class="stats" id="exStats"></div>
  </div>
  <div id="resumeBox"></div>

  <div id="secWrap">
    <div class="section-title">اختر القسم</div>
    <div class="choices" id="secChoices"></div>
  </div>

  <div class="section-title">طريقة الحل</div>
  <div class="choices two" id="modeChoices">
    <button class="choice" data-mode="exam" aria-pressed="true"><span class="ic">📝</span><span><b>وضع الامتحان</b><small>النتيجة في النهاية</small></span></button>
    <button class="choice" data-mode="practice" aria-pressed="false"><span class="ic">💡</span><span><b>وضع التدريب</b><small>تصحيح فوري لكل سؤال</small></span></button>
  </div>

  <div class="card toggle-row">
    <span><b style="font-size:15px">ترتيب عشوائي للأسئلة</b><br><small style="color:var(--muted)">حتى لا تحفظ الترتيب</small></span>
    <button class="switch" id="shuffleSw" role="switch" aria-checked="false" aria-label="ترتيب عشوائي"></button>
  </div>

  <div style="margin-top:20px"><button class="btn primary block" id="startBtn">ابدأ الامتحان ←</button></div>
  <p class="foot">الإجابات معتمدة من الإجابات النموذجية</p>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="topbar"><div class="in">
    <div class="tb-row">
      <span class="pill" id="counter">١ / ١</span>
      <span class="pill" id="scorePill" style="display:none"></span>
      <span class="pill">⏱ <span id="timer">00:00</span></span>
      <button class="pill" id="finishTop" style="color:var(--brand);border-color:var(--brand)">إنهاء</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div class="card qcard" id="qcard" aria-live="polite"></div>
    <div class="kbd">اختصارات: <b>1</b>–<b>4</b> للاختيار · <b>←</b> التالي · <b>→</b> السابق · <b>F</b> تعليم · <b>M</b> الخريطة</div>
  </div>
  <div class="navbar"><div class="in">
    <button class="btn ghost" id="prevBtn">→ السابق</button>
    <button class="btn ghost grid" id="gridBtn" aria-label="خريطة الأسئلة">▦</button>
    <button class="btn primary" id="nextBtn">التالي ←</button>
  </div></div>
</section>

<!-- RESULTS -->
<section id="results" class="wrap hidden"></section>

<div id="layer"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const LET = ["أ","ب","ج","د","هـ","و"];
const SITE_URL = location.origin + location.pathname.replace(/[^/]*$/, "");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const sessKey = id => "exam-sess-"+id, bestKey = id => "exam-best-"+id;

let INDEX = null;      // exams.json
let EX = null;         // current exam data
let QMAP = {};         // id -> question (with sec + n)
let SECNAME = {};
let cfg = {sec:"all", mode:"exam", shuffle:false};
let S = null;          // session
let tick = null;

function fmt(s){const m=Math.floor(s/60), x=s%60; return AR(String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"));}
const qById = id => QMAP[id];
function show(id){["home","start","quiz","results"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id)); window.scrollTo(0,0);}
async function getJSON(url){ const r = await fetch(url, {cache:"no-cache"}); if(!r.ok) throw new Error(r.status); return r.json(); }

/* ================= HOME ================= */
async function loadIndex(){
  if(INDEX) return INDEX;
  INDEX = await getJSON("exams.json?t="+Date.now());
  const st = INDEX.site||{};
  $("#siteTitle").textContent = st.title||"منصّة الامتحانات";
  $("#siteSub").textContent = st.subtitle||"";
  $("#siteTeacher").textContent = st.teacher||"";
  const n=(INDEX.exams||[]).filter(e=>e.visible!==false).length;
  $("#siteEyebrow").textContent = n===1?"امتحان واحد متاح":n===2?"امتحانان متاحان":n<=10?AR(n)+" امتحانات متاحة":AR(n)+" امتحانًا متاحًا";
  document.title = st.title||document.title;
  return INDEX;
}
function renderHome(){
  const list = (INDEX.exams||[]).filter(e=>e.visible!==false);
  if(!list.length){ $("#examList").innerHTML = `<div class="card err">لا توجد امتحانات متاحة حاليًا</div>`; return; }
  $("#examList").innerHTML = list.map((e,i)=>{
    const best = store.get(bestKey(e.id)), sess = store.get(sessKey(e.id));
    const inprog = sess && !sess.done && sess.answers && Object.keys(sess.answers).length;
    return `<button class="exam-card" data-id="${esc(e.id)}" style="animation-delay:${i*.04}s">
      <span class="num">${AR(i+1)}</span>
      <span class="body"><h3>${esc(e.title)}</h3>${e.desc?`<p>${esc(e.desc)}</p>`:""}
        <span class="meta"><span class="chip">${AR(e.count||0)} سؤال</span>
        ${best?`<span class="chip best">أفضل نتيجة ${AR(best.pct)}٪</span>`:""}
        ${inprog?`<span class="chip prog">قيد الحل</span>`:""}</span></span>
      <span class="go">‹</span></button>`;
  }).join("");
  document.querySelectorAll(".exam-card").forEach(b=>b.onclick=()=>{ location.hash = "exam-"+b.dataset.id; });
}

/* ================= EXAM LOAD ================= */
async function openExam(id){
  await loadIndex();
  const meta = (INDEX.exams||[]).find(e=>e.id===id);
  if(!meta){ location.hash=""; return; }
  if(!EX || EX.id!==id){
    show("home"); $("#examList").innerHTML = `<div class="loading"><div class="spinner"></div>جاري تحميل الامتحان…</div>`;
    EX = await getJSON("exams/"+encodeURIComponent(id)+".json?v="+(meta.v||1));
    QMAP = {}; SECNAME = {};
    (EX.sections||[]).forEach(s=>SECNAME[s.id]=s.name);
    const cnt = {};
    EX.questions.forEach(q=>{ cnt[q.s]=(cnt[q.s]||0)+1; QMAP[q.id] = {id:q.id, sec:q.s, n:cnt[q.s], text:q.q, opts:q.o, ans:q.a, exp:q.e||""}; });
    EX.counts = cnt;
  }
  cfg.sec="all";
  const s = store.get(sessKey(id));
  if(s && s.done && s.ids && s.ids.every(x=>QMAP[x]) && location.hash.endsWith("/result")){ S=s; renderResults(); show("results"); return; }
  renderStart();
  show("start");
}
function renderStart(){
  const secs = EX.sections||[], total = EX.questions.length;
  $("#exTitle").textContent = EX.title;
  $("#exDesc").textContent = EX.desc||"";
  $("#exEyebrow").textContent = (INDEX.site&&INDEX.site.teacher) ? INDEX.site.teacher : "امتحان";
  $("#exStats").innerHTML = `<div class="stat"><b>${AR(total)}</b><span>سؤال</span></div>` +
    (secs.length>1 ? secs.map(s=>`<div class="stat"><b>${AR(EX.counts[s.id]||0)}</b><span>${esc(s.name)}</span></div>`).join("") : "");
  $("#secWrap").classList.toggle("hidden", secs.length<2);
  if(secs.length>1){
    let h = `<button class="choice" data-sec="all" aria-pressed="true"><span class="ic">📚</span><span><b>الامتحان كاملًا</b><small>${AR(total)} سؤال</small></span></button><div class="choices two">`;
    const icons=["📖","✍️","🧩","🎯","📘","🧠"];
    secs.forEach((s,i)=>{ h+=`<button class="choice" data-sec="${esc(s.id)}" aria-pressed="false"><span class="ic">${icons[i%icons.length]}</span><span><b>${esc(s.name)}</b><small>${AR(EX.counts[s.id]||0)} سؤال</small></span></button>`; });
    $("#secChoices").innerHTML = h+"</div>";
    document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{cfg.sec=b.dataset.sec;document.querySelectorAll("[data-sec]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  }
  renderResume();
}
$("#backHome").onclick=()=>{ location.hash=""; };
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("#shuffleSw").onclick=e=>{cfg.shuffle=!cfg.shuffle;e.currentTarget.setAttribute("aria-checked",cfg.shuffle)};
$("#startBtn").onclick=()=>{
  const ids = EX.questions.filter(q=>cfg.sec==="all"||q.s===cfg.sec).map(q=>q.id);
  newSession(ids, cfg.mode, cfg.sec);
};
function newSession(ids, mode, sec){
  ids = ids.slice();
  if(cfg.shuffle){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}
  S = {exam:EX.id, ids, answers:{}, flags:{}, i:0, elapsed:0, mode, sec, done:false};
  save(); startQuiz();
}
function renderResume(){
  const s = store.get(sessKey(EX.id)); const box = $("#resumeBox");
  if(s && !s.done && s.ids && s.ids.every(x=>QMAP[x]) && Object.keys(s.answers).length){
    const n=Object.keys(s.answers).length;
    box.innerHTML = `<div class="card resume"><span><b>عندك امتحان لم يكتمل</b><br><small style="color:var(--muted)">أجبت ${AR(n)} من ${AR(s.ids.length)} · ${fmt(s.elapsed)}</small></span><span style="display:flex;gap:8px"><button class="btn ghost" id="discard" style="padding:10px 12px">حذف</button><button class="btn primary" id="resume" style="padding:10px 14px">أكمل</button></span></div>`;
    $("#resume").onclick=()=>{S=s;startQuiz()};
    $("#discard").onclick=()=>{store.del(sessKey(EX.id));box.innerHTML=""};
  } else box.innerHTML="";
}
function save(){ if(S) store.set(sessKey(S.exam),S); }

/* ================= QUIZ ================= */
function startQuiz(){
  if(!location.hash.startsWith("#exam-"+EX.id)) history.replaceState(null,"","#exam-"+EX.id);
  show("quiz"); renderQ();
  clearInterval(tick);
  tick = setInterval(()=>{if(document.hidden||!S||S.done)return; S.elapsed++; $("#timer").textContent=fmt(S.elapsed); if(S.elapsed%5===0) save();},1000);
  $("#timer").textContent=fmt(S.elapsed);
}
function qHTML(q){
  let parts = esc(q.text).split("\n");
  return parts.length>1 ? `<span class="quote">${parts[0]}</span>${parts.slice(1).join("<br>")}` : parts[0];
}
function renderQ(){
  const q = qById(S.ids[S.i]); const a = S.answers[q.id]; const total=S.ids.length;
  const practice = S.mode==="practice"; const locked = practice && a!==undefined;
  $("#counter").textContent = AR(S.i+1)+" / "+AR(total);
  const answered = Object.keys(S.answers).length;
  $("#prog").style.width = (answered/total*100)+"%";
  if(practice){
    const right = S.ids.filter(id=>S.answers[id]!==undefined && S.answers[id]===qById(id).ans).length;
    $("#scorePill").style.display=""; $("#scorePill").innerHTML = `✓ ${AR(right)} <span style="color:var(--muted)">·</span> ✗ ${AR(answered-right)}`;
  } else $("#scorePill").style.display="none";
  const tag = (EX.sections||[]).length>1 ? `${esc(SECNAME[q.sec]||"")} · س${AR(q.n)}` : `س${AR(q.n)}`;
  let html = `<div class="qmeta"><span class="tag">${tag}</span>
    <button class="flag" id="flagBtn" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id]?"★ مُعلَّم":"☆ علّم للمراجعة"}</button></div>
    <div class="qtext">${qHTML(q)}</div><div class="opts">`;
  q.opts.forEach((o,k)=>{
    let cls="opt";
    if(locked){ if(k===q.ans) cls+=" right"; else if(k===a) cls+=" wrong"; }
    else if(a===k) cls+=" sel";
    html += `<button class="${cls}" data-k="${k}" ${locked?"disabled":""}><span class="L">${LET[k]}</span><span>${esc(o)}</span></button>`;
  });
  html += `</div>`;
  if(locked){
    html += a===q.ans ? `<div class="feedback ok">✓ إجابة صحيحة، أحسنت!</div>`
                      : `<div class="feedback no">✗ الإجابة الصحيحة: (${LET[q.ans]}) ${esc(q.opts[q.ans])}</div>`;
    if(q.exp) html += `<div class="explain">💡 ${esc(q.exp)}</div>`;
  }
  $("#qcard").classList.toggle("no-anim", renderQ.last===q.id);
  renderQ.last = q.id;
  $("#qcard").innerHTML = html;
  $("#qcard").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  $("#flagBtn").onclick=()=>{S.flags[q.id]=!S.flags[q.id]; if(!S.flags[q.id]) delete S.flags[q.id]; save(); renderQ();};
  $("#prevBtn").disabled = S.i===0; $("#prevBtn").style.opacity = S.i===0?.4:1;
  $("#nextBtn").textContent = S.i===total-1 ? "إنهاء وعرض النتيجة ✓" : "التالي ←";
}
function choose(k){
  const q = qById(S.ids[S.i]);
  if(k>=q.opts.length) return;
  if(S.mode==="practice" && S.answers[q.id]!==undefined) return;
  S.answers[q.id]=k; save(); renderQ();
  if(S.mode==="exam" && S.i < S.ids.length-1) setTimeout(()=>{ if(S && !S.done && S.ids[S.i]===q.id){S.i++;save();renderQ();window.scrollTo({top:0,behavior:"smooth"});} }, 260);
}
$("#prevBtn").onclick=()=>{ if(S.i>0){S.i--;save();renderQ();window.scrollTo(0,0);} };
$("#nextBtn").onclick=()=>{ if(S.i<S.ids.length-1){S.i++;save();renderQ();window.scrollTo(0,0);} else confirmFinish(); };
$("#finishTop").onclick=confirmFinish;
$("#gridBtn").onclick=openGrid;
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
document.addEventListener("keydown",e=>{
  if($("#quiz").classList.contains("hidden") || e.ctrlKey || e.metaKey || e.altKey) return;
  const ov = $("#ov");
  if(e.key==="Escape" && ov){ closeLayer(); return; }
  if(ov) return;
  const map={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"أ":0,"ب":1,"ج":2,"د":3};
  if(e.key in map){ e.preventDefault(); choose(map[e.key]); }
  else if(e.key==="ArrowLeft"||e.key==="Enter"){ e.preventDefault(); $("#nextBtn").click(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); $("#prevBtn").click(); }
  else if(e.key.toLowerCase()==="f"){ $("#flagBtn")?.click(); }
  else if(e.key.toLowerCase()==="m"){ openGrid(); }
});
function closeLayer(){ $("#layer").innerHTML=""; }
function openGrid(){
  const groups = {};
  S.ids.forEach((id,idx)=>{const q=qById(id);(groups[q.sec]=groups[q.sec]||[]).push([id,idx])});
  const multi = Object.keys(groups).length>1;
  let h = `<div class="overlay" id="ov"><div class="sheet"><h3>خريطة الأسئلة</h3>
   <div class="legend"><span><i style="background:var(--brand-soft);border:1.5px solid var(--brand)"></i>مُجاب</span><span><i style="border:1.5px solid var(--line)"></i>لم يُجب</span><span><i style="background:var(--warn);border-radius:50%"></i>مُعلَّم</span></div>`;
  for(const sec of Object.keys(groups)){
    if(multi) h+=`<div class="grid-head">${esc(SECNAME[sec]||"")}</div>`;
    h+=`<div class="grid10">`;
    groups[sec].forEach(([id,idx])=>{
      const q=qById(id), a=S.answers[id];
      let c="cell";
      if(a!==undefined) c += S.mode==="practice" ? (a===q.ans?" r":" w") : " ans";
      if(S.flags[id]) c+=" fl"; if(idx===S.i) c+=" cur";
      h+=`<button class="${c}" data-idx="${idx}">${AR(idx+1)}</button>`;
    });
    h+=`</div>`;
  }
  h+=`<div style="margin-top:16px;display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="closeG">إغلاق</button><button class="btn primary" style="flex:1" id="finG">إنهاء الامتحان</button></div></div></div>`;
  $("#layer").innerHTML=h;
  $("#ov").onclick=e=>{if(e.target.id==="ov")closeLayer()};
  $("#closeG").onclick=closeLayer;
  $("#finG").onclick=()=>{closeLayer();confirmFinish()};
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{S.i=+b.dataset.idx;save();closeLayer();renderQ();window.scrollTo(0,0)});
}
function confirmFinish(){
  const left = S.ids.length - Object.keys(S.answers).length;
  $("#layer").innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <div style="font-size:40px">${left? "⚠️":"🎯"}</div>
    <h3>${left? "باقي "+AR(left)+" سؤال بدون إجابة":"جاهز لعرض النتيجة؟"}</h3>
    <p>${left? "الأسئلة غير المجابة تُحسب خطأ. متأكد أنك تريد الإنهاء؟":"أجبت عن كل الأسئلة."}</p>
    <div class="row"><button class="btn ghost" id="cBack">${left?"أكمل الحل":"رجوع"}</button><button class="btn primary" id="cGo">اعرض نتيجتي</button></div></div></div>`;
  $("#cBack").onclick=closeLayer; $("#cGo").onclick=()=>{closeLayer();finish()};
}

/* ================= RESULTS ================= */
let rvFilter="wrong";
function finish(){
  clearInterval(tick); S.done=true; save();
  history.replaceState(null,"","#exam-"+S.exam+"/result");
  renderResults(); show("results");
}
function gradeOf(p){
  if(p>=95) return ["ممتاز جدًا! 🏆","أداء استثنائي، أنت جاهز تمامًا."];
  if(p>=85) return ["ممتاز 🌟","مستوى عالٍ، راجع الأخطاء القليلة فقط."];
  if(p>=75) return ["جيد جدًا 👏","قريب من القمة، ركّز على أخطائك."];
  if(p>=65) return ["جيد 👍","أساس جيد، المراجعة سترفعك كثيرًا."];
  if(p>=50) return ["مقبول","تحتاج مراجعة مركّزة للقسم الأضعف."];
  return ["تحتاج مراجعة 💪","راجع الدرس ثم أعد الأخطاء فقط."];
}
function renderResults(){
  const tot=S.ids.length;
  let right=0, wrong=0, skip=0; const per={};
  S.ids.forEach(id=>{const q=qById(id),a=S.answers[id];
    per[q.sec]=per[q.sec]||{r:0,t:0}; per[q.sec].t++;
    if(a===undefined) skip++; else if(a===q.ans){right++;per[q.sec].r++} else wrong++;});
  const pct = Math.round(right/tot*1000)/10;
  // best score only for full-length attempts of the whole exam
  if(S.sec==="all" && tot===EX.questions.length){
    const b = store.get(bestKey(S.exam));
    if(!b || pct > b.pct){ store.set(bestKey(S.exam), {pct, right, tot}); S.newBest = !!b; }
  }
  const [g,gs]=gradeOf(pct);
  const C=2*Math.PI*72, off=C*(1-right/tot);
  const color = pct>=75?"var(--ok)":pct>=50?"var(--warn)":"var(--bad)";
  const scope = S.sec==="all" ? "الامتحان كاملًا" : "قسم "+(SECNAME[S.sec]||"");
  let h = `<button class="back" id="resHome">→ كل الامتحانات</button>
   <div class="card result-hero">
    <span class="eyebrow">${esc(EX.title)} · ${scope} · ${S.mode==="practice"?"تدريب":"امتحان"}</span>
    <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="none" stroke="var(--line)" stroke-width="14"/>
      <circle cx="85" cy="85" r="72" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="arc" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
      <div class="val"><b>${AR(right)}<span style="font-size:20px;color:var(--muted)">/${AR(tot)}</span></b><span>${AR(pct)}٪</span></div></div>
    <div class="grade">${g}</div><p class="sub">${gs}</p>
    ${S.newBest?`<p class="sub" style="color:var(--ok);font-weight:700;margin-top:6px">🎉 رقم قياسي جديد لك!</p>`:""}
    <div class="breakdown">
      <div class="bd"><b style="color:var(--ok)">${AR(right)}</b><span>صحيحة</span></div>
      <div class="bd"><b style="color:var(--bad)">${AR(wrong)}</b><span>خاطئة</span></div>
      <div class="bd"><b>${fmt(S.elapsed)}</b><span>الوقت</span></div>
    </div>
    ${skip?`<p class="sub" style="margin-top:10px">${AR(skip)} بدون إجابة (محسوبة خطأ)</p>`:""}
  </div>`;
  if(Object.keys(per).length>1){
    h+=`<div class="card secbars">`;
    for(const s of Object.keys(per)){const p=per[s];h+=`<div class="sb"><div class="h"><span>${esc(SECNAME[s]||"")}</span><span>${AR(p.r)} / ${AR(p.t)} · ${AR(Math.round(p.r/p.t*100))}٪</span></div><div class="bar"><i style="width:${p.r/p.t*100}%"></i></div></div>`}
    h+=`</div>`;
  }
  h+=`<div class="actions">
    <button class="btn primary" id="retryWrong" ${wrong+skip?"":"disabled style='opacity:.5'"}>أعد الأخطاء (${AR(wrong+skip)})</button>
    <button class="btn ghost" id="again">حلّ من جديد</button></div>
    <div class="share-row"><button class="btn ghost" id="shareBtn">📤 شارك نتيجتك مع أصحابك</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" data-f="wrong" aria-selected="${rvFilter==="wrong"}">الأخطاء (${AR(wrong+skip)})</button>
      <button class="tab" data-f="flag" aria-selected="${rvFilter==="flag"}">المُعلَّمة (${AR(Object.keys(S.flags).length)})</button>
      <button class="tab" data-f="all" aria-selected="${rvFilter==="all"}">كل الأسئلة</button>
    </div><div id="rvList"></div>`;
  $("#results").innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=$("#arc"); if(a) a.style.strokeDashoffset=off}));
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{rvFilter=t.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));renderReview()});
  $("#resHome").onclick=()=>{ location.hash=""; };
  $("#shareBtn").onclick=()=>shareResult(right,tot,pct);
  if(pct>=85 && !S.celebrated){ S.celebrated=true; save(); setTimeout(confetti,400); }
  $("#again").onclick=()=>{store.del(sessKey(S.exam));S=null;history.replaceState(null,"","#exam-"+EX.id);renderStart();show("start")};
  $("#retryWrong").onclick=()=>{const ids=S.ids.filter(id=>S.answers[id]!==qById(id).ans);if(ids.length){newSession(ids,S.mode,S.sec)}};
  renderReview();
}
function renderReview(){
  const list = S.ids.filter(id=>{const q=qById(id),a=S.answers[id];
    if(rvFilter==="wrong") return a!==q.ans; if(rvFilter==="flag") return S.flags[id]; return true;});
  if(!list.length){$("#rvList").innerHTML=`<div class="empty">${rvFilter==="wrong"?"🎉 لا توجد أخطاء!":"لا يوجد شيء هنا"}</div>`;return}
  $("#rvList").innerHTML = list.map(id=>{
    const q=qById(id), a=S.answers[id];
    const st = a===undefined?`<span class="status skip">بدون إجابة</span>`: a===q.ans?`<span class="status ok">صحيحة</span>`:`<span class="status no">خاطئة</span>`;
    const tag = (EX.sections||[]).length>1 ? `${esc(SECNAME[q.sec]||"")} · س${AR(q.n)}` : `س${AR(q.n)}`;
    return `<div class="card rv"><div class="qmeta"><span class="tag">${tag}</span>${st}</div>
      <div class="qtext">${qHTML(q)}</div><div class="opts">${q.opts.map((o,k)=>{
        let c="opt"; if(k===q.ans)c+=" right"; else if(k===a)c+=" wrong";
        return `<div class="${c}"><span class="L">${LET[k]}</span><span>${esc(o)}</span></div>`}).join("")}</div>${q.exp?`<div class="explain">💡 ${esc(q.exp)}</div>`:""}</div>`;
  }).join("");
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"), x=c.getContext("2d"), dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#8a1d5c","#e05aa3","#1f8a5b","#f2b632","#3b82f6"];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0; (function step(){ x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++f<150) requestAnimationFrame(step); else x.clearRect(0,0,innerWidth,innerHeight); })();
}
async function shareResult(right,tot,pct){
  const url=SITE_URL+"#exam-"+EX.id;
  const text=`جبت ${AR(right)} من ${AR(tot)} (${AR(pct)}٪) في «${EX.title}» 📚 جرّب حظك:`;
  try{ if(navigator.share){ await navigator.share({title:EX.title,text,url}); return; } }catch(e){ if(e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+" "+url); toast("انتسخت النتيجة مع الرابط ✓"); }catch(e){ toast(url); }
}

/* ================= ROUTER ================= */
async function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  try{
    if(h.startsWith("exam-")){
      const id = h.slice(5).split("/")[0];
      if(S && !S.done && S.exam===id && !$("#quiz").classList.contains("hidden")) return;
      clearInterval(tick);
      await openExam(id);
    } else {
      clearInterval(tick); S=null;
      await loadIndex(); renderHome(); show("home");
    }
  }catch(e){
    show("home");
    $("#examList").innerHTML = `<div class="card err">تعذّر التحميل، تأكد من الإنترنت ثم <button class="btn ghost" onclick="location.reload()" style="margin-top:10px">أعد المحاولة</button></div>`;
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
